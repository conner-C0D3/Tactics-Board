   how a coach actually calls a drill — "go when the pass is played" — and it
   stays right when the ball speed changes or a player is dragged further away.
   Seconds on a stopwatch would not.

   No `run` means a player stands still, which is what every drill did before
   runs existed, so nothing saved earlier plays differently.
   ============================================================ */
const RUN_C = "#ffffff";
const RUN_SPEED = 6;               // yd/s — a working run; a pass is far quicker
const RUN_GAP = 1.9;               // keep the line clear of the player's own marker

// the full point list a run travels, starting from where the player stands
function runPoints(it){
  const r = it.run;
  if (!r || !r.pts || !r.pts.length) return null;
  return [{ x: it.x, y: it.y }, ...r.pts];
}

/* Legs from a list of points, shared by the ball path and by every run, so both
   get the same constant-speed timing from the same arithmetic. `tags` rides
   along on the leg for whatever the caller needs to know about the point it ends
   on — the ball uses it to carry which foot the pass is going to. */
function legsFrom(pts, tags){
  const legs = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++){
    const a = pts[i-1], b = pts[i];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    if (len < 0.01) continue;                    // a repeated point is not a leg
    /* Both ends are tagged, not just the arrival. `tag` is what the foot
       highlight reads; `tag0` is what lets playback re-aim a leg at a player
       who has moved since kick-off. */
    legs.push({ a, b, len, at: total,
                tag: tags ? tags[i] : null, tag0: tags ? tags[i-1] : null });
    total += len;
  }
  return { legs, total };
}
// position along a leg list at cumulative distance d
function pointOn(legs, d){
  if (!legs.length) return null;
  if (d <= 0) return legs[0].a;
  for (const L of legs){
    if (d <= L.at + L.len){
      const t = (d - L.at) / L.len;
      return { x: L.a.x + (L.b.x - L.a.x) * t, y: L.a.y + (L.b.y - L.a.y) * t };
    }
  }
  return legs[legs.length - 1].b;
}
// rot 0 faces up the screen, so a heading is measured from -y, clockwise
const headingDeg = (a, b) => Math.atan2(b.x - a.x, -(b.y - a.y)) * 180 / Math.PI;

/* A hand-drawn stroke arrives as a few hundred samples of where the pointer was,
   which is far more detail than a run has. Ramer–Douglas–Peucker throws away every
   point that the line would pass within RUN_EPS of anyway, so what is kept is the
   shape the coach drew and not the shake in their hand.

   Simplifying rather than smoothing is deliberate. A run stays a plain list of
   points whichever way it was drawn, so freehand and clicked runs render, save,
   rotate and — the one that matters — play back through exactly the same code. A
   fitted curve would need its own arc-length arithmetic to keep a runner at
   constant speed, and would be a second definition of what a run is. */
const RUN_EPS = 1.0;               // units — a third of a yard
function simplify(pts, eps){
  if (pts.length < 3) return pts.slice();
  const a = pts[0], b = pts[pts.length - 1];
  const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
  let worst = -1, wi = 0;
  for (let i = 1; i < pts.length - 1; i++){
    const p = pts[i];
    // distance to the chord — or to the shared endpoint, if the stroke came back on itself
    const d = L < 1e-6 ? Math.hypot(p.x - a.x, p.y - a.y)
                       : Math.abs(dy * (p.x - a.x) - dx * (p.y - a.y)) / L;
    if (d > worst){ worst = d; wi = i; }
  }
  if (worst <= eps) return [a, b];
  return simplify(pts.slice(0, wi + 1), eps).slice(0, -1)
    .concat(simplify(pts.slice(wi), eps));
}

/* Who is being drawn for right now. Authoring state, not drill state: it is never
   saved, never pushed to history, and clearing it leaves the run untouched. */
let runner = null;                 // { key, id } or null

/* The armed player's timing, in the topbar. A run needs three numbers a coach
   actually says out loud — when to go, how long to wait, how hard to run — and
   they belong on the player being drawn for rather than in a mode-wide setting,
   because two players in the same drill rarely go at the same moment.

   `trig.stop` names a STOP on the ball path, never a time. A stop keeps meaning
   what it meant when the drill was written: change the ball speed, or drag the
   passer twenty yards further out, and "go when the pass is played" is still
   true, where "go at 1.4 seconds" would quietly become wrong. */
function runTarget(){
  if (!runner || mode !== "run") return null;
  return state[runner.key].items.find(i => i.id === runner.id) || null;
}
function syncRunPanel(){
  const panel = $("#runOpts"), it = runTarget();
  panel.style.display = it ? "" : "none";
  if (!it) return;
  $("#runWho").textContent = (KIT[it.type].name || "Player") + (it.n ? " " + it.n : "");
  const stops = seqPoints(runner.key).length;
  const sel = $("#runTrig");
  /* Rebuilt from the current path each time, because stops come and go while a
     drill is being written and a stale list would offer a stop that is not there. */
  sel.innerHTML = stops
    ? Array.from({ length: stops }, (_, i) =>
        `<option value="${i}">${i === 0 ? "on the pass" : `at stop ${i + 1}`}</option>`).join("")
    : `<option value="0">at the start</option>`;
  const trig = (it.run && it.run.trig) || { stop: 0, delay: 0 };
  // clamp rather than reset: a stop deleted underneath a run should not lose the timing
  sel.value = String(Math.max(0, Math.min(Math.max(stops - 1, 0), trig.stop | 0)));
  $("#runDelay").value = String(+trig.delay || 0);
  $("#runSpeed").value = String((it.run && it.run.speed) || RUN_SPEED);
}
function editRun(fn){
  const it = runTarget();
  if (!it) return;
  if (!it.run) it.run = { pts: [], trig: { stop: 0, delay: 0 } };
  fn(it.run);
  simStop();
  pushHistory();
  syncRunPanel();
}

function setRunner(r, quiet){
  const was = runner;
  runner = r;
  // only redraw if something actually changed, so setMode can call this blindly
  if (was && (!r || was.id !== r.id || was.key !== r.key)) renderRuns(was.key);
  if (r) renderRuns(r.key);
  syncRunPanel();
  if (quiet) return;
  if (r){
    const it = state[r.key].items.find(i => i.id === r.id);
    const n = it && it.run && it.run.pts ? it.run.pts.length : 0;
    setStatus(n ? `Drawing a run — ${n} waypoint${n === 1 ? "" : "s"}. Right-click undoes the last; click the player again to finish.`
                : "Drawing a run — click where they should go. Click the player again to finish.");
  } else if (was){
    setStatus("Run finished — click another player to draw theirs");
  }
}
const isRunner = it => !!(runner && runner.id === it.id);

function renderRuns(key){
  const layer = svgs[key].querySelector(".run-layer");
  if (!layer) return;
  let out = "";
  for (const it of state[key].items){
    const pts = runPoints(it);
    /* The armed player is drawn even with no waypoints yet, as a ring round their
       marker — otherwise arming somebody gives no feedback at all until the first
       click, and it is not obvious that anything happened. */
    if (!pts){
      if (runner && runner.key === key && isRunner(it))
        out += `<circle cx="${it.x.toFixed(2)}" cy="${it.y.toFixed(2)}" r="${(PLAYER_R + 0.9).toFixed(2)}"
                        fill="none" stroke="${RUN_C}" stroke-width="0.35"
                        stroke-dasharray="1.2 1.2" opacity="0.9"/>`;
      continue;
    }
    const live = runner && runner.key === key && isRunner(it);
    const op = live ? 1 : 0.85;
    for (let i = 1; i < pts.length; i++){
      const a = pts[i-1], b = pts[i];
      const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
      if (L < 0.01) continue;
      /* Only the very first leg is pulled back, and only at its start, to clear
         the runner's own marker. Every other joint is left whole: trimming the
         ends of the middle legs would open a gap at each one, which on a clicked
         run reads as a dashed line and on a drawn one — where the legs are a few
         inches long — erases the run altogether. */
      const t0 = i === 1 ? Math.min(RUN_GAP / L, 0.45) : 0;
      const t1 = 1;
      if (t1 <= t0) continue;
      // the head goes on the last leg only, so a run has one arrow, not a row of them
      const head = i === pts.length - 1 ? ` marker-end="url(#run-${key})"` : "";
      out += `<line data-run="${it.id}" data-leg="${i}"
                    x1="${(a.x+dx*t0).toFixed(2)}" y1="${(a.y+dy*t0).toFixed(2)}"
                    x2="${(a.x+dx*t1).toFixed(2)}" y2="${(a.y+dy*t1).toFixed(2)}"
                    stroke="${RUN_C}" stroke-width="${live ? 0.6 : 0.45}" stroke-linecap="round"
                    opacity="${op}"${head}/>`;
    }
    /* Handles on the waypoints. Every one gets an invisible target so any of them
       can be clicked away, but the last is left undrawn — it already has the
       arrowhead, and a dot underneath makes the tip look blunt. `data-wp` indexes
       run.pts, which is one behind pts because pts[0] is the player.

       A drawn run gets no handles at all. Its points are samples of a stroke
       rather than places the coach meant, so studding the curve with a dozen dots
       would claim a precision that was never there and invite people to nudge
       points that only exist because the pointer happened to pass through them. */
    if (it.run.free) continue;
    out += pts.slice(1).map((p, j) => {
      const dot = j < pts.length - 2
        ? `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${live ? 0.65 : 0.5}"
                   fill="${RUN_C}" opacity="${live ? 1 : 0.75}"/>` : "";
      return dot + `<circle class="stop-hit" data-run="${it.id}" data-wp="${j}"
                            cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="1.6"/>`;
    }).join("");
  }
  layer.innerHTML = out;
}

/* auto-numbering for players, per colour, lowest free number */
function nextNumber(key, type){
  const used = new Set(state[key].items.filter(i => i.type === type).map(i => i.n));
  let n = 1;
  while (used.has(n)) n++;
  return n;
}

/* ============================================================
   FORMATIONS AND UNITS — shape that reacts to the ball

   A UNIT is a named set of players that hold their shape together: a back four,
   a midfield three, a front two. A POLICY is the rule that decides where that
   shape sits given where the ball is.

   The policy contract is the load-bearing decision here. A policy is handed the
   ball and the unit's resting shape, and may return only a RIGID TRANSFORM of the
   whole unit — a translation, plus an optional squeeze toward its own centre.
   It cannot move one defender. That restriction is what makes "shape" mean
   something structural rather than aspirational: however clever a policy gets, it
   is arithmetically incapable of stretching the back four's spacing, because it
   never sees an individual player's position as something it can write to.

   The alternative — letting a policy return a target per player — collapses into
   a run generator that happens to be spelled "formation", and the guarantee goes
   with it. If a future policy genuinely needs to deform the block, the contract
   widens once, in one place, and every existing policy still holds.

   Runs beat units. A player with a hand-drawn run is driven by the run and
   ignored by their unit for the length of the drill: an explicit instruction from
   the coach outranks the default behaviour of the block they stand in.
   ============================================================ */

/* The pitch's own axes, in world coordinates.

   Taken from the PITCH, never from the players. A back four standing on a line
   does have an obvious axis of its own, but a front two standing one behind the
   other has one at right angles to the truth and a unit of one has none at all,
   so a shape-derived axis fails exactly where a coach would be most surprised.
   The pitch always knows where its goals are. `land` is kept in step with the
   field's rotation by applyTurns, so a turned pitch answers correctly without
   anybody having to thread `turns` through the policy layer. */
function pitchAxes(key){
  const f = FIELDS[key];
  return f.land ? { wide:{ x:0, y:1 }, along:{ x:1, y:0 } }    // goals left and right
                : { wide:{ x:1, y:0 }, along:{ x:0, y:1 } };   // goals top and bottom
}
function goalMouths(key){
  const f = FIELDS[key];
  return f.land ? [{ x:f.x0, y:f.cy }, { x:f.x1, y:f.cy }]
                : [{ x:f.cx, y:f.y0 }, { x:f.cx, y:f.y1 }];
}
const dot = (a, b) => a.x * b.x + a.y * b.y;
function centroidOf(pts){
  if (!pts.length) return { x:0, y:0 };
  return { x: pts.reduce((s,p)=>s+p.x,0) / pts.length,
           y: pts.reduce((s,p)=>s+p.y,0) / pts.length };
}

/* ---------- the policy registry ----------
   Adding a behaviour is a new entry in this table and nothing else: playback
   looks the policy up by key and applies whatever rigid transform comes back, so
   it has no idea how many policies exist or what any of them mean.

   Every policy is handed the same context and returns { dx, dy, squeeze }, all
   optional. `a` is the unit's own strength dial, 0 to 1. `wide` points across the
   pitch and `back` points from the unit toward the goal it is defending, so a
   policy is written in the language a coach uses — across, drop, push up — and
   stays correct on a pitch that has been rotated or on a unit defending the other
   end. `bw` and `bb` are the ball's offset from the unit's resting centre
   resolved onto those two axes. */
const SQUEEZE_REF = 35 * U;        // ball this far away and a block sits at full width
/* Depth is damped against width, because defending is not symmetric. A back four
   shuffles across almost yard for yard with the ball — staying ball-side is the
   whole job — but it does not march up and down the pitch to match, because the
   goal behind it does not move. Without this the line tracks a ball played 40 yd
   upfield by 40 yd upfield, which is pressing, not holding a line.

   It is a property of the game rather than of any one policy, so it lives here
   with the axes instead of being baked into each fn where three policies would
   have to agree on it. */
const DEPTH_GAIN = 0.4;
const SHAPE = {
  hold: {
    label: "Hold shape",
    blurb: "Stands still. The unit is drawn and named but does not react.",
    fn: () => ({})
  },
  slide: {
    label: "Slide across",
    blurb: "Shuffles across the pitch with the ball, keeping its depth.",
    fn: c => ({ dx: c.wide.x * c.bw * c.a, dy: c.wide.y * c.bw * c.a })
  },
  drop: {
    label: "Drop and push",
    blurb: "Drops toward its own goal as the ball advances, pushes up as it retreats.",
    fn: c => ({ dx: c.back.x * c.bb * c.a * DEPTH_GAIN,
                dy: c.back.y * c.bb * c.a * DEPTH_GAIN })
  },
  block: {
    label: "Slide, drop and squeeze",
    blurb: "A defensive block: across with the ball, back as it advances, and tighter the closer it gets.",
    /* The squeeze is what makes this read as defending rather than as a rigid
       shelf being pushed around. A block gets compact as the ball nears it and
       spreads again as the ball goes away, which is the single most recognisable
       thing a back four does. */
    fn: c => ({
      dx: (c.wide.x * c.bw + c.back.x * c.bb * DEPTH_GAIN) * c.a,
      dy: (c.wide.y * c.bw + c.back.y * c.bb * DEPTH_GAIN) * c.a,
      squeeze: c.a * 0.45 * Math.max(0, 1 - c.dist / SQUEEZE_REF)
    })
  },
  press: {
    label: "Press the ball",
    blurb: "The whole unit travels at the ball and tightens hard.",
    fn: c => ({
      dx: (c.ball.x - c.home.x) * c.a,
      dy: (c.ball.y - c.home.y) * c.a,
      squeeze: c.a * 0.6
    })
  }
};
const SHAPE_DEFAULT = "hold";

/* Resolve a unit against a ball position and return where each member should
   stand. Rest positions are passed in rather than read from the state so that
   playback can freeze them once at kick-off: reading live positions every frame
   would let a unit chase its own output and drift down the pitch.

   `ball` may be null — a drill with no ball path at all — in which case the unit
   simply stands on its marks. */
function shapePose(key, u, rest, ball){
  const home = centroidOf(rest);
  const out = new Map();
  const spec = SHAPE[u.policy] || SHAPE[SHAPE_DEFAULT];
  let dx = 0, dy = 0, squeeze = 0;
  if (ball && spec !== SHAPE.hold){
    const ax = pitchAxes(key);
    /* Which way is "back" is derived, not configured: the goal nearest the unit's
       resting centre is the one it is defending. A coach never has to say it, and
       it stays right when the pitch is rotated or the drill is built at the other
       end. */
    const mouths = goalMouths(key);
    const near = Math.hypot(mouths[0].x - home.x, mouths[0].y - home.y)
               < Math.hypot(mouths[1].x - home.x, mouths[1].y - home.y) ? mouths[0] : mouths[1];
    const bx = { x: near.x - home.x, y: near.y - home.y };
    const bl = Math.hypot(bx.x, bx.y) || 1;
    const back = { x: bx.x / bl, y: bx.y / bl };
    const rel = { x: ball.x - home.x, y: ball.y - home.y };
    const r = spec.fn({
      ball, home, back, wide: ax.wide, along: ax.along,
      bw: dot(rel, ax.wide),                       // ball's offset across the pitch
      bb: dot(rel, back),                          // ...and toward the goal being defended
      dist: Math.hypot(rel.x, rel.y),
      a: Math.max(0, Math.min(1, u.amount == null ? 0.5 : +u.amount)),
      key
    }) || {};
    dx = +r.dx || 0; dy = +r.dy || 0;
    squeeze = Math.max(0, Math.min(0.9, +r.squeeze || 0));
  }
  /* Clamp the OFFSET rather than each player, so a unit pushed at the touchline
     stops as one piece. Clamping members individually would flatten the block
     against the edge of the pitch and quietly break the rigidity this whole
     module exists to guarantee. */
  const f = FIELDS[key];
  const sq = p => ({ x: home.x + (p.x - home.x) * (1 - squeeze),
                     y: home.y + (p.y - home.y) * (1 - squeeze) });
  const pts = rest.map(sq);
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const lo = PLAYER_R, hi = PLAYER_R;
  dx = Math.min(dx, (f.ax1 - hi) - Math.max(...xs));
  dx = Math.max(dx, (f.ax0 + lo) - Math.min(...xs));
  dy = Math.min(dy, (f.ay1 - hi) - Math.max(...ys));
  dy = Math.max(dy, (f.ay0 + lo) - Math.min(...ys));
  rest.forEach((p, i) => out.set(p.id, { x: pts[i].x + dx, y: pts[i].y + dy }));
  return out;
}

/* ---------- formation templates ----------
   Each line is one unit. `d` is depth from the goal being defended as a fraction
   of the pitch length, and `xs` are positions across it as fractions of the
   width. Fractions rather than yards so a template drops sensibly onto any of
   the pitches, which are not the same size as each other.

   Stamping is a starting position and a grouping, not a cage: the moment the
   players are down they are ordinary items that can be dragged anywhere, and the
   unit follows them because it holds ids rather than coordinates. */
/* Keys are prefixed so they are not integer-like. A plain "442" would be an array
   index as far as the engine is concerned, and Object.entries would hand them
   back in numeric order — putting 3-4-3 at the top of the menu. */
const FORMATIONS = {
  "f442":  { label:"4-4-2", lines:[
    { name:"Keeper",        d:0.03, xs:[0.50], kit:"keeper" },
    { name:"Back four",     d:0.16, xs:[0.16, 0.38, 0.62, 0.84] },
    { name:"Midfield four", d:0.36, xs:[0.16, 0.38, 0.62, 0.84] },
    { name:"Front two",     d:0.55, xs:[0.40, 0.60] } ] },
  "f433":  { label:"4-3-3", lines:[
    { name:"Keeper",         d:0.03, xs:[0.50], kit:"keeper" },
    { name:"Back four",      d:0.16, xs:[0.16, 0.38, 0.62, 0.84] },
    { name:"Midfield three", d:0.34, xs:[0.28, 0.50, 0.72] },
    { name:"Front three",    d:0.56, xs:[0.20, 0.50, 0.80] } ] },
  "f4231": { label:"4-2-3-1", lines:[
    { name:"Keeper",      d:0.03, xs:[0.50], kit:"keeper" },
    { name:"Back four",   d:0.16, xs:[0.16, 0.38, 0.62, 0.84] },
    { name:"Double pivot",d:0.31, xs:[0.38, 0.62] },
    { name:"Attacking three", d:0.47, xs:[0.20, 0.50, 0.80] },
    { name:"Striker",     d:0.60, xs:[0.50] } ] },
  "f352":  { label:"3-5-2", lines:[
    { name:"Keeper",        d:0.03, xs:[0.50], kit:"keeper" },
    { name:"Back three",    d:0.16, xs:[0.28, 0.50, 0.72] },
    { name:"Midfield five", d:0.36, xs:[0.10, 0.30, 0.50, 0.70, 0.90] },
    { name:"Front two",     d:0.55, xs:[0.40, 0.60] } ] },
  "f343":  { label:"3-4-3", lines:[
    { name:"Keeper",         d:0.03, xs:[0.50], kit:"keeper" },
    { name:"Back three",     d:0.16, xs:[0.28, 0.50, 0.72] },
    { name:"Midfield four",  d:0.35, xs:[0.12, 0.38, 0.62, 0.88] },
    { name:"Front three",    d:0.56, xs:[0.20, 0.50, 0.80] } ] }
};
/* A stamped unit's default behaviour, by name. The whole point of stamping a
   formation rather than grouping players by hand is that the block already knows
   roughly how to defend — a back four slides and squeezes, a front line presses,
   a keeper shuffles across his line. All of it is overridable per unit. */
function defaultPolicy(name){
  if (/keeper/i.test(name))                 return { policy:"slide", amount:0.25, lag:0.1 };
  if (/back/i.test(name))                   return { policy:"block", amount:0.55, lag:0.35 };
  if (/mid|pivot/i.test(name))              return { policy:"block", amount:0.45, lag:0.5 };
  return                                           { policy:"slide", amount:0.3,  lag:0.7 };
}

let unitSel = null;                // which unit the panel is editing, by id

function unitsOf(key){ return state[key].units || (state[key].units = []); }
function unitById(key, id){ return unitsOf(key).find(u => u.id === id) || null; }
// members, in the order the unit lists them, skipping any that have been deleted
function unitItems(key, u){
  const byId = new Map(state[key].items.map(i => [i.id, i]));
  return u.ids.map(id => byId.get(id)).filter(Boolean);
}

/* Put a formation on the pitch, defending `end` (0 = the near goal in world
   terms, 1 = the far one), and make each of its lines a unit. */
function stampFormation(key, code, type, end){
  const spec = FORMATIONS[code];
  if (!spec) return null;
  const f = FIELDS[key], ax = pitchAxes(key);
  const mouths = goalMouths(key);
  const own = mouths[end ? 1 : 0], other = mouths[end ? 0 : 1];
  // straight down the middle of the pitch from one goal to the other
  const len = { x: other.x - own.x, y: other.y - own.y };
  // wYd is the goal-line dimension, i.e. the width, whichever way the pitch faces
  const half = f.wYd * U / 2;
  const made = [];
  for (const line of spec.lines){
    const ids = [];
    for (const t of line.xs){
      const cx = own.x + len.x * line.d + ax.wide.x * (t - 0.5) * 2 * half;
      const cy = own.y + len.y * line.d + ax.wide.y * (t - 0.5) * 2 * half;
      /* A line may name its own kit — the keeper is a keeper whichever colour
         the outfield is wearing — and everything else takes the team colour. */
      const kt = (line.kit && KIT[line.kit]) ? line.kit : type;
      const c = clampItem(key, snapVal(cx), snapVal(cy), kt, 0);
      const p = freeSpot(key, null, kt, 0, c.x, c.y);
      ids.push(pushItem(key, kt, p.x, p.y, 0).id);
    }
    const d = defaultPolicy(line.name);
    const u = { id:"u" + (uid++), name:line.name, ids, ...d };
    unitsOf(key).push(u);
    made.push(u);
  }
  return made;
}

/* ---------- drawing a unit ----------
   The hull is the ground the block covers. Andrew's monotone chain, which is a
   dozen lines and exact, rather than an approximation that would wobble as the
   unit squeezes. A unit of one or two has no area, so it is drawn as a capsule
   along its members instead of collapsing to nothing. */
function hull(pts){
  if (pts.length < 3) return pts.slice();
  const p = pts.slice().sort((a,b) => a.x - b.x || a.y - b.y);
  const cross = (o,a,b) => (a.x-o.x)*(b.y-o.y) - (a.y-o.y)*(b.x-o.x);
  const lower = [], upper = [];
  for (const q of p){ while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], q) <= 0) lower.pop(); lower.push(q); }
  for (let i = p.length - 1; i >= 0; i--){ const q = p[i];
    while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], q) <= 0) upper.pop(); upper.push(q); }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}
const UNIT_C = "#7dd3fc";
function renderUnits(key){
  const layer = svgs[key].querySelector(".unit-layer");
  if (!layer) return;
  let out = "";
  for (const u of unitsOf(key)){
    const its = unitItems(key, u);
    if (!its.length) continue;
    const pts = its.map(it => livePose(it));
    const on = unitSel === u.id;
    const h = hull(pts);
    const c = centroidOf(pts);
    const body = h.length >= 3
      ? `<polygon points="${h.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(" ")}"/>`
      : `<line x1="${pts[0].x.toFixed(2)}" y1="${pts[0].y.toFixed(2)}"
               x2="${pts[pts.length-1].x.toFixed(2)}" y2="${pts[pts.length-1].y.toFixed(2)}"/>`;
    out += `<g class="unit${on ? " on" : ""}" data-unit="${u.id}"
               fill="${UNIT_C}" fill-opacity="${on ? 0.14 : 0.07}"
               stroke="${UNIT_C}" stroke-opacity="${on ? 0.85 : 0.4}"
               stroke-width="${on ? 0.5 : 0.34}" stroke-dasharray="2 1.4"
               stroke-linejoin="round" stroke-linecap="round">${body}
             <text x="${c.x.toFixed(2)}" y="${c.y.toFixed(2)}" fill="${UNIT_C}"
                   fill-opacity="${on ? 0.95 : 0.55}" stroke="none" font-size="2.6"
                   text-anchor="middle" style="pointer-events:none">${u.name}</text></g>`;
  }
  layer.innerHTML = out;
}

/* The shape panel. The formation half is always live — you can always stamp one
   — while the unit half only means anything once a unit exists, so it is disabled
   rather than hidden: the controls are where you last saw them, greyed, instead
   of the whole toolbar reflowing every time a formation is added or dropped. */
function syncShapePanel(){
  const key = current, us = unitsOf(key), f = FIELDS[key];
  const pick = $("#unitPick");
  if (!unitById(key, unitSel)) unitSel = us.length ? us[0].id : null;
  pick.innerHTML = us.length
    ? us.map(u => `<option value="${u.id}">${u.name}</option>`).join("")
    : `<option value="">no units yet</option>`;
  if (unitSel) pick.value = unitSel;
  const u = unitById(key, unitSel);
  ["unitPick","unitPolicy","unitAmt","unitLag","unitDrop"].forEach(i => $("#" + i).disabled = !u);
  if (u){
    $("#unitPolicy").value = SHAPE[u.policy] ? u.policy : SHAPE_DEFAULT;
    $("#unitAmt").value = String(u.amount == null ? 0.5 : u.amount);
    $("#unitLag").value = String(+u.lag || 0);
    $("#unitAmt").title = `${SHAPE[u.policy] ? SHAPE[u.policy].blurb : ""} — strength ${Math.round((u.amount||0)*100)}%`;
  }
  /* Which end is which depends on how the pitch is facing, and the pitch can be
     turned under the panel, so the wording is derived rather than written into
     the markup. */
  const ends = f.land ? ["defends left", "defends right"] : ["defends top", "defends bottom"];
  [...$("#formEnd").options].forEach((o, i) => o.textContent = ends[i]);
}

/* ============================================================
   BOX SELECT — highlight a run of grid squares, read its size,
   then turn it into tape or a ring of cones.
   The selection is a measuring overlay, not field content: it lives outside
   `state`, so it is not undoable and is not written into saved setups.
   ============================================================ */
let boxSel = null;                 // { key, x1, y1, x2, y2 } already normalised

// Box corners ride the grid intersections only, never cell centres — that is
// what makes the count come out as whole squares.
function snapCorner(v){ return snap ? ORIGIN + Math.round((v - ORIGIN) / U) * U : Math.round(v * 10) / 10; }

function normBox(b){
  return { x1:Math.min(b.x1,b.x2), y1:Math.min(b.y1,b.y2),
           x2:Math.max(b.x1,b.x2), y2:Math.max(b.y1,b.y2) };
}
function boxSize(b){
  const n = normBox(b);
  const w = (n.x2 - n.x1) / U, h = (n.y2 - n.y1) / U;
  // whole squares only when both sides land on the grid
  const cells = (Math.abs(w - Math.round(w)) < 1e-6 && Math.abs(h - Math.round(h)) < 1e-6)
    ? Math.round(w) * Math.round(h) : null;
  return { w, h, cells };
}
const fmtYd = v => (Math.abs(v - Math.round(v)) < 1e-6 ? String(Math.round(v)) : v.toFixed(1));
function boxLabel(b){
  const { w, h, cells } = boxSize(b);
  return `${fmtYd(w)} × ${fmtYd(h)} yd` + (cells ? ` · ${cells} square${cells === 1 ? "" : "s"}` : "");
}

function selMarkup(b, live){
  const n = normBox(b);
  const w = n.x2 - n.x1, h = n.y2 - n.y1;
  const stroke = live ? "#4ade80" : "#38bdf8";
  const txt = boxLabel(n);
  // chip above the box, or tucked inside when the box is up against the top
  const cy = n.y1 > 18 ? n.y1 - 3.4 : n.y2 + 4.6;
  const cw = txt.length * 1.32 + 4;
  return `<rect x="${n.x1}" y="${n.y1}" width="${w}" height="${h}"
                fill="${stroke}" fill-opacity="0.12" stroke="${stroke}" stroke-width="0.45"
                stroke-dasharray="2.4 1.8"/>
          <line x1="${n.x1}" y1="${n.y1+h/2}" x2="${n.x2}" y2="${n.y1+h/2}"
                stroke="${stroke}" stroke-width="0.22" stroke-dasharray="1 1.6" opacity="0.7"/>
          <line x1="${n.x1+w/2}" y1="${n.y1}" x2="${n.x1+w/2}" y2="${n.y2}"
                stroke="${stroke}" stroke-width="0.22" stroke-dasharray="1 1.6" opacity="0.7"/>
          <g>
            <rect x="${n.x1 + w/2 - cw/2}" y="${cy - 2.7}" width="${cw}" height="4.4" rx="1.6"
                  fill="rgba(9,17,12,0.86)" stroke="${stroke}" stroke-width="0.25"/>
            <text x="${n.x1 + w/2}" y="${cy + 0.6}" text-anchor="middle" font-family="sans-serif"
                  font-size="2.6" font-weight="600" fill="${stroke}">${txt}</text>
          </g>`;
}
function renderSel(){
  for (const k in FIELDS){
    const l = svgs[k].querySelector(".sel-layer");
    l.innerHTML = (boxSel && boxSel.key === k) ? selMarkup(boxSel, false) : "";
  }
  syncBoxPanel();
}
// `b` is the in-progress drag, if any — the readout follows the mouse live,
// but the build buttons only unlock once a selection has been committed
function syncBoxPanel(b, live){
  const sel = b || boxSel;
  const el = $("#boxDims");
  el.textContent = sel ? boxLabel(sel) : "no selection";
  el.classList.toggle("live", !!live);
  $("#boxTape").disabled = !boxSel;
  $("#boxCones").disabled = !boxSel;
}
function clearSel(quiet){
  if (!boxSel) return;
  boxSel = null;
  renderSel();
  if (!quiet) setStatus("Selection cleared");
}

// the cone dropdown just mirrors whatever cones the kit table offers
(function fillBoxCones(){
  const sel = $("#boxCone");
  sel.innerHTML = Object.keys(KIT).filter(k => KIT[k].cone)
    .map(k => `<option value="${k}">${KIT[k].name}</option>`).join("");
  sel.value = "coneOrange";
})();

// corners in draw order, closing back on the start
function boxCorners(b){
  const n = normBox(b);
  return [{x:n.x1,y:n.y1},{x:n.x2,y:n.y1},{x:n.x2,y:n.y2},{x:n.x1,y:n.y2}];
}
function buildBoxTape(){
  if (!boxSel) return;
  const key = boxSel.key, c = boxCorners(boxSel);
  for (let i = 0; i < 4; i++){
    const a = c[i], b = c[(i+1) % 4];
    state[key].tape.push({ id:"t"+(uid++), x1:a.x, y1:a.y, x2:b.x, y2:b.y,
                           color:tapeColor, dashed:tapeDashed, type:lineType });
  }
  renderField(key); pushHistory();
  setStatus(`Taped a ${boxLabel(boxSel)} box`);
}
function buildBoxCones(){
  if (!boxSel) return;
  const key = boxSel.key, type = $("#boxCone").value;
  const gapYd = Math.max(0.5, parseFloat($("#boxSpacing").value) || 2);
  const c = boxCorners(boxSel);
  const pts = [];
  for (let i = 0; i < 4; i++){
    const a = c[i], b = c[(i+1) % 4];
    const len = Math.hypot(b.x-a.x, b.y-a.y);
    if (len < 1e-6) continue;
    // round the count so the spacing divides the side evenly and the corners
    // always get a cone — a ring with a ragged corner reads as a mistake
    const n = Math.max(1, Math.round(len / (gapYd * U)));
    for (let s = 0; s < n; s++){
      const t = s / n;
      pts.push({ x: a.x + (b.x-a.x)*t, y: a.y + (b.y-a.y)*t });
    }
  }
  // a zero-width or zero-height box collapses two sides onto each other
  const uniq = [];
  pts.forEach(p => { if (!uniq.some(q => Math.hypot(q.x-p.x, q.y-p.y) < 0.05)) uniq.push(p); });
  uniq.forEach(p => {
    const q = clampItem(key, p.x, p.y, type, 0);
    state[key].items.push({ id:"i"+(uid++), type, x:q.x, y:q.y, rot:0 });
  });
  renderField(key); pushHistory();
  setStatus(`${uniq.length} × ${KIT[type].name} around a ${boxLabel(boxSel)} box`);
}

/* ---------- row helper: evenly spaced points from A to B ---------- */
function rowPoints(r){
  const dx = r.x2 - r.x1, dy = r.y2 - r.y1;
  const len = Math.hypot(dx, dy);
  const byGap = $("#rowMode").value === "gap";
  const val = Math.max(1, parseFloat($("#rowVal").value) || 1);
  let n;
  if (byGap) n = Math.floor(len / (val * U) + 1e-6) + 1;   // val = yards between items
  else       n = Math.round(val);                          // val = how many in total
  n = Math.max(1, Math.min(60, n));
  const pts = [];
  for (let i = 0; i < n; i++){
    const t = n === 1 ? 0 : i / (n - 1);
    pts.push({ x: r.x1 + dx * t, y: r.y1 + dy * t });
  }
  return { pts, len, gap: n > 1 ? len / (n - 1) : 0 };
}

/* ---------- alignment: snap onto the line of matching equipment ----------
   Evaluated on the RAW pointer position, before grid snapping. Grid snap
   quantises to 3-unit steps, so if alignment ran after it the candidate would
   already be either exactly on the line or a full yard off it, and the
   tolerance could never fire. Alignment wins; grid snap handles the rest. */
// Tuned against the snap step: the grid is now half-yard (1.5 units), so the
// pull has to be just wider than one step or it would swallow the finer targets.
const ALIGN_TOL = 1.6;                                     // SVG units (~0.53 yd)
function alignAxis(pool, value, axis){
  let best = null, bestD = ALIGN_TOL;
  pool.forEach(o => { const d = Math.abs(o[axis] - value); if (d < bestD){ bestD = d; best = o[axis]; } });
  return best;
}
// returns the aligned coordinate per axis, or null when nothing is in range
function alignSnap(key, id, type, x, y){
  if (!alignOn) return { gx:null, gy:null };
  const others = state[key].items.filter(i => i.id !== id);
  const same = others.filter(i => i.type === type);
  // matching equipment wins; fall back to anything else on that axis
  return {
    gx: alignAxis(same, x, "x") ?? alignAxis(others, x, "x"),
    gy: alignAxis(same, y, "y") ?? alignAxis(others, y, "y")
  };
}
// grid snap, unless alignment has claimed that axis
function resolve(key, id, type, rot, x, y){
  const a = alignSnap(key, id, type, x, y);
  // both axes free -> joint corner/centre choice; one axis pinned by alignment
  // -> the other falls back to the nearest half-yard on its own
  const s = (a.gx === null && a.gy === null)
    ? snapPoint(x, y) : { x: snapVal(x), y: snapVal(y) };
  const c = clampItem(key, a.gx ?? s.x, a.gy ?? s.y, type, rot);
  const p = freeSpot(key, id, type, rot, c.x, c.y);          // never land on another player
  return { x:p.x, y:p.y, gx:a.gx, gy:a.gy, bumped: p.x !== c.x || p.y !== c.y };
}

/* ---------- placing ----------
   A bundle (5 Balls) is a shortcut, not a compound object: it drops five
   ordinary balls in a loose cluster so each one can be dragged out on its own. */
function pushItem(key, type, x, y, rot){
  const it = { id:"i" + (uid++), type, x, y, rot: rot || 0 };
  if (KIT[type].player) it.n = nextNumber(key, type);
  state[key].items.push(it);
  return it;
}
function placeBundle(key, type, x, y){
  const b = KIT[type].bundle;
  b.offs.forEach(([dx, dy]) => {
    const c = clampItem(key, x + dx, y + dy, b.type, 0);
    pushItem(key, b.type, c.x, c.y, 0);
  });
  renderField(key); pushHistory();
  setStatus(`Placed ${b.offs.length} × ${KIT[b.type].name}`);
}
function place(key, type, x, y){
  if (KIT[type].bundle){ placeBundle(key, type, snapVal(x), snapVal(y)); return; }
  const p = resolve(key, null, type, 0, x, y);       // aligns to an existing row on drop
  pushItem(key, type, p.x, p.y, 0);
  renderField(key); pushHistory();
  setStatus(`Placed ${KIT[type].name}`
    + (p.gx !== null || p.gy !== null ? " — aligned" : "")
    + (p.bumped ? " — moved to the next free square" : ""));
}

for (const key in FIELDS){
  const svg = svgs[key];

  svg.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
  svg.addEventListener("drop", e => {
    e.preventDefault();
    const type = e.dataTransfer.getData("text/plain");
    if (!KIT[type]) return;
    const p = svgPoint(svg, e.clientX, e.clientY);
    place(key, type, p.x, p.y);
  });

  svg.addEventListener("contextmenu", e => {
    /* Right-click pops the last waypoint, the same gesture that undoes the last
       ball stop — one rule for both kinds of path, so there is nothing new to
       learn. Popping the only waypoint drops the run entirely rather than leaving
       an empty one behind for buildMovers to skip over. */
    if (mode === "run"){
      e.preventDefault();
      simStop();
      const it = runner && state[key].items.find(i => i.id === runner.id);
      if (!it || !it.run || !it.run.pts.length){ setStatus("No waypoints to remove"); return; }
      /* On a drawn run there is nothing meaningful to undo point by point — its
         points are samples, and rubbing out the last inch of a curve is not what
         anybody means by undo. The whole stroke goes, ready to be drawn again. */
      if (it.run.free){
        delete it.run;
        renderField(key); pushHistory();
        setStatus("Run cleared — drag from the player to draw a new one");
        return;
      }
      it.run.pts.pop();
      if (!it.run.pts.length) delete it.run;
      renderField(key); pushHistory();
      const n = it.run ? it.run.pts.length : 0;
      setStatus(n ? `Waypoint removed — ${n} left` : "Run cleared");
      return;
    }
    if (mode === "ball"){
      e.preventDefault();
      simStop();
      /* Right-click ON a badge removes that stop; right-click on empty grass still
         pops the last one. Deleting had to leave the plain click, which now always
         adds a stop so the ball can be played back to someone already in the path,
         and it landed here: right-click is the gesture this app already uses to
         undo a point on a path. */
      const badge = e.target.closest("[data-stop]");
      if (badge){ dropStop(key, +badge.dataset.stop); return; }
      if (!state[key].seq.length){ setStatus("No stops to remove"); return; }
      state[key].seq.pop();
      renderField(key); pushHistory();
      setStatus(`Last stop removed — ${seqPoints(key).length} left`);
      return;
    }
    const g = e.target.closest(".item"); if (!g) return;
    e.preventDefault();
    const it = state[key].items.find(i => i.id === g.dataset.id);
    if (!it) return;
    it.rot = (Math.round(((it.rot || 0) + 90) / 90) * 90) % 360;
    const p = clampItem(key, it.x, it.y, it.type, it.rot);
    it.x = p.x; it.y = p.y;
    renderField(key); pushHistory(); setStatus(`Rotated to ${it.rot}°`);
  });

  /* ---------- pointer: move items, delete, draw tape ---------- */
  let drag = null, draw = null, spin = null, row = null, pan = null, box = null, sketch = null;

  /* A click in Run mode. Split out of pointerdown because in Run mode a press is
     ambiguous until it is released: hold still and it is a click, move and it is
     a freehand stroke. So nothing can be decided until pointerup, and this is the
     half that runs when the pointer never went anywhere. */
  function runClick(e, p){
    const g = e.target.closest(".item");
    const hitItem = g && state[key].items.find(i => i.id === g.dataset.id);

    if (!runner){
      if (!hitItem){ setStatus("Click a player first, or drag from one to draw their run"); return; }
      if (!KIT[hitItem.type].player){ setStatus("Only players can be given a run"); return; }
      setRunner({ key, id: hitItem.id });
      return;
    }
    const it = state[key].items.find(i => i.id === runner.id);
    if (!it){ setRunner(null, true); return; }        // the player was deleted underneath us
    if (hitItem && hitItem.id === it.id){ setRunner(null); return; }   // click them again = done

    // clicking one of this run's own waypoints takes it out of the middle
    const wp = e.target.closest("[data-wp]");
    if (wp && wp.dataset.run === it.id){
      it.run.pts.splice(+wp.dataset.wp, 1);
      if (!it.run.pts.length) delete it.run;
      renderField(key); pushHistory();
      setStatus(it.run ? `Waypoint removed — ${it.run.pts.length} left` : "Run cleared");
      return;
    }
    /* Clicking on a run that was drawn rather than clicked appends to it, which
       would mix a hand-drawn shape with a straight jump to wherever the click
       landed. Refuse, and say how to start again — one run has one shape. */
    if (it.run && it.run.free){
      setStatus("That run was drawn — drag from the player again to redraw it");
      return;
    }
    /* A click on another player means "run to them", so the waypoint lands on
       their marker rather than on the snap lattice near it — a run onto a
       teammate should finish where the teammate actually is. */
    const sp = hitItem ? { x: hitItem.x, y: hitItem.y } : snapPoint(p.x, p.y);
    if (!it.run) it.run = { pts: [], trig: { stop: 0, delay: 0 } };
    it.run.pts.push({ x: sp.x, y: sp.y });
    renderField(key); pushHistory();
    const n = it.run.pts.length;
    const yd = (legsFrom(runPoints(it)).total / U).toFixed(1);
    setStatus(`Waypoint ${n} — ${yd} yd run. Click the player to finish, right-click to undo.`);
  }

  /* The other half: the pointer moved, so this was a stroke. The samples are
     simplified down to the shape that was drawn and stored as ordinary waypoints,
     so from here on a drawn run is indistinguishable from a clicked one. */
  function runSketchEnd(){
    const it = state[key].items.find(i => i.id === sketch.id);
    if (!it){ sketch = null; return; }
    /* Drop the samples still inside the player's own marker. A stroke necessarily
       starts on top of the player, and those first few points would otherwise
       become a waypoint sitting under their feet — a run that begins by standing
       still, and a heading taken from a leg pointing nowhere. */
    const raw = sketch.pts.filter(q => Math.hypot(q.x - it.x, q.y - it.y) > PLAYER_R + 0.6);
    if (raw.length < 2){ sketch = null; setStatus("Too short to be a run — drag further"); return; }
    /* Simplify from the player's own position and then drop it again. The run
       starts there whether or not it is stored, so including it lets the first
       point be judged against the line the player will actually be travelling —
       without it, a straight sprint keeps a redundant point a yard off the toes,
       bought only by the stroke having had to start somewhere. */
    const pts = simplify([{ x: it.x, y: it.y }, ...raw], RUN_EPS).slice(1);
    const trig = (it.run && it.run.trig) || { stop: 0, delay: 0 };
    it.run = { pts, trig, free: true };
    setRunner({ key, id: it.id }, true);
    renderField(key); pushHistory();
    const yd = (legsFrom(runPoints(it)).total / U).toFixed(1);
    setStatus(`Run drawn — ${yd} yd, ${pts.length} points. Drag again to redraw it.`);
    sketch = null;
  }

  /* Pan by scrolling the viewport. Works at any zoom; when the field already
     fits on screen there is nothing to scroll and this is a harmless no-op. */
  function startPan(e){
    pan = { sx:e.clientX, sy:e.clientY, l:viewport.scrollLeft, t:viewport.scrollTop, moved:false };
    document.body.classList.add("panning");
    svg.setPointerCapture(e.pointerId);
  }
  function endPan(){
    if (!pan) return;
    document.body.classList.remove("panning");
    pan = null;
  }

  /* Rotation. Two ways in: shift-drag, or press and hold on an item for HOLD_MS
     and then drag. Both land here, so they behave identically from that point —
     swing the pointer around the item, let go to set the angle. */
  function startSpin(it, g, px, py){
    spin = { it, g, start: it.rot || 0, changed:false,
             a0: Math.atan2(py - it.y, px - it.x) * 180 / Math.PI };
    svg.querySelector(".ghost-layer").innerHTML =
      `<circle cx="${it.x}" cy="${it.y}" r="${Math.max(KIT[it.type].hw, KIT[it.type].hh) + 2}"
               fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.4" stroke-dasharray="1.5 1.5"/>`;
  }
  function endHold(){ if (drag && drag.hold){ clearTimeout(drag.hold); drag.hold = null; } }

  // middle-drag always pans, even mid-tool, so you never have to change mode
  svg.addEventListener("pointerdown", e => {
    if (e.button === 1){ e.preventDefault(); startPan(e); }
  });
  svg.addEventListener("auxclick", e => { if (e.button === 1) e.preventDefault(); });

  svg.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    // alt-drag pans from anywhere, including on top of equipment
    if (e.altKey){ e.preventDefault(); startPan(e); return; }
    const p = svgPoint(svg, e.clientX, e.clientY);

    if (mode === "box"){
      const x = snapCorner(p.x), y = snapCorner(p.y);
      box = { key, x1:x, y1:y, x2:x, y2:y };
      boxSel = null;
      renderSel();
      svg.setPointerCapture(e.pointerId);
      setStatus("Drag out the area you want to measure");
      return;
    }

    /* Run mode, one player at a time, and two ways to say the same thing.

       CLICK to place waypoints: arm a player, then every click drops one until
       you click that player again. Same rhythm as the ball path, so there is
       nothing new to learn, and it gives exact positions — a run to the near post
       goes to the near post.

       DRAG from a player to draw the run in one stroke. Faster, and the only
       practical way to express a curve: bending round the back of a defender is
       one flick of the wrist and about fifteen clicks.

       Which one happened is not known until the pointer is released, so this
       records the press and both branches wait for pointerup. Only one player is
       armed at once, because a run is a single person's route and drawing two at
       the same time would leave no way to say which click belonged to whom. */
    if (mode === "run"){
      simStop();
      const g = e.target.closest(".item");
      const hit = g && state[key].items.find(i => i.id === g.dataset.id);
      // a stroke can only start on a player: it is their run being drawn
      const from = hit && KIT[hit.type].player ? hit.id : null;
      sketch = { id: from, pts: from ? [{ x:p.x, y:p.y }] : [],
                 sx: e.clientX, sy: e.clientY, moved: false, e, p };
      svg.setPointerCapture(e.pointerId);
      return;
    }

    if (mode === "ball"){
      simStop();
      const seq = state[key].seq;
      /* The badge is a small numbered disc sitting up-left of the marker, and it
         overlaps a player. That used to mean a plain click on a player already in
         the path landed on their badge and DELETED their stop — so the one thing
         a coach most wants to draw, a ball played back to the same player, was
         the one thing the gesture would not let them do.

         So a plain click always adds a stop, on anybody, however many times. A
         give-and-go is click A, click B, click A. Deleting a stop moved to
         RIGHT-click on its badge, handled in the contextmenu listener above —
         not alt-click, because alt-drag already pans from anywhere on the pitch
         and an alt-press never reaches this branch. Shift-click on a badge still
         cycles the foot. */
      const badge = e.target.closest("[data-stop]");
      if (badge && e.shiftKey){
        /* Shift-click cycles which foot the ball is played with — either foot,
           then left, then right. */
        const vis = +badge.dataset.stop, idx = seqIndexAt(key, vis);
        if (idx < 0) return;
        const nd = seq[idx];
        if (nd.k !== "i"){ setStatus("Only a stop on a player can name a foot"); return; }
        nd.foot = !nd.foot ? "L" : nd.foot === "L" ? "R" : null;
        renderField(key); pushHistory();
        setStatus(`Stop ${vis + 1} — ${nd.foot === "L" ? "left foot"
                                     : nd.foot === "R" ? "right foot" : "either foot"}`);
        return;
      }
      const g = e.target.closest(".item");
      if (g){
        const it = state[key].items.find(i => i.id === g.dataset.id);
        if (it) seq.push(KIT[it.type].player ? { k:"i", id:it.id, foot: pickFoot(key, it) }
                                             : { k:"p", x:it.x, y:it.y });
      } else {
        const sp = snapPoint(p.x, p.y);
        seq.push({ k:"p", x: sp.x, y: sp.y });
      }
      renderField(key); pushHistory();
      const n = seqPoints(key).length;
      setStatus(n === 1 ? "Stop 1 — the ball starts here. Click the same player again to play it back."
                        : `Stop ${n} added — right-click a stop to remove it, shift-click to change the foot`);
      return;
    }

    if (mode === "row"){
      if (!pending){ setStatus("Pick equipment from the left first"); return; }
      const { x, y } = snapPoint(p.x, p.y);
      row = { x1:x, y1:y, x2:x, y2:y };
      svg.setPointerCapture(e.pointerId);
      return;
    }

    if (mode === "tape"){
      const { x, y } = snapPoint(p.x, p.y);
      draw = { x1:x, y1:y, x2:x, y2:y };
      svg.setPointerCapture(e.pointerId);
      return;
    }

    if (mode === "guides"){
      const { x, y } = snapPoint(p.x, p.y);
      guides = { x1:x, y1:y, x2:x, y2:y };
      svg.setPointerCapture(e.pointerId);
      return;
    }

    const hitTape = e.target.closest("[data-tape]");
    if (hitTape){
      state[key].tape = state[key].tape.filter(t => t.id !== hitTape.dataset.tape);
      renderField(key); pushHistory(); setStatus("Tape removed");
      return;
    }

    const hitGuide = e.target.closest("[data-guide]");
    if (hitGuide){
      if (!state[key].guides) state[key].guides = [];
      state[key].guides = state[key].guides.filter(g => g.id !== hitGuide.dataset.guide);
      renderField(key); pushHistory(); setStatus("Guide removed");
      return;
    }

    const g = e.target.closest(".item");
    if (g){
      const it = state[key].items.find(i => i.id === g.dataset.id);

      if (e.shiftKey){ startSpin(it, g, p.x, p.y); svg.setPointerCapture(e.pointerId); return; }

      // Otherwise this is a move — but hold still for HOLD_MS and it becomes a
      // rotate instead, so the same gesture works without reaching for shift.
      const d0 = { it, g, moved:false, ox:p.x - it.x, oy:p.y - it.y, sx:e.clientX, sy:e.clientY,
                   cx:e.clientX, cy:e.clientY, hold:null };
      drag = d0;
      // `drag === d0` guards against a stale timer from an earlier press
      d0.hold = setTimeout(() => {
        if (drag !== d0 || d0.moved) return;
        const q = svgPoint(svg, d0.cx, d0.cy);
        d0.g.style.opacity = "";
        drag = null;
        startSpin(d0.it, d0.g, q.x, q.y);
        setStatus("Rotate — swing the pointer around the item, let go to set it");
      }, HOLD_MS);
      g.style.opacity = "0.6";
      svg.setPointerCapture(e.pointerId);
      return;
    }

    if (pending){ place(key, pending, p.x, p.y); return; }

    // empty grass with nothing armed — grab the pitch and drag it around
    startPan(e);
  });

  svg.addEventListener("pointermove", e => {
    if (sketch){
      if (!sketch.moved && Math.hypot(e.clientX - sketch.sx, e.clientY - sketch.sy) <= 3) return;
      /* Past the threshold this is a stroke, not a click. If it did not start on a
         player there is nobody to draw for, so the drag pans the pitch instead —
         the same thing dragging empty grass does in Select mode. */
      if (!sketch.id){
        const s = sketch; sketch = null;
        startPan({ clientX:s.sx, clientY:s.sy, pointerId:e.pointerId });
        return;
      }
      sketch.moved = true;
      const q = svgPoint(svg, e.clientX, e.clientY);
      /* Thin the samples on the way in as well as on the way out. A pointer sitting
         still still fires moves, and a hundred coincident points would dominate the
         simplify pass without adding a thing to the shape. */
      const last = sketch.pts[sketch.pts.length - 1];
      if (!last || Math.hypot(q.x - last.x, q.y - last.y) > 0.6) sketch.pts.push({ x:q.x, y:q.y });
      const it = state[key].items.find(i => i.id === sketch.id);
      const path = sketch.pts.map((r, i) => `${i ? "L" : "M"}${r.x.toFixed(2)} ${r.y.toFixed(2)}`).join(" ");
      svg.querySelector(".ghost-layer").innerHTML =
        `<path d="${path}" fill="none" stroke="${RUN_C}" stroke-width="0.55"
               stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>`;
      if (it) setStatus(`Drawing a run — ${(legsFrom([{x:it.x,y:it.y},...sketch.pts]).total / U).toFixed(1)} yd`);
      return;
    }
    if (pan){
      const dx = e.clientX - pan.sx, dy = e.clientY - pan.sy;
      if (!pan.moved && Math.hypot(dx, dy) > 2){
        pan.moved = true;
        setStatus("Panning — drag to move around the field");
      }
      viewport.scrollLeft = pan.l - dx;
      viewport.scrollTop  = pan.t - dy;
      return;
    }
    if (box){
      const p = svgPoint(svg, e.clientX, e.clientY);
      box.x2 = snapCorner(p.x); box.y2 = snapCorner(p.y);
      svg.querySelector(".sel-layer").innerHTML = selMarkup(box, true);
      syncBoxPanel(box, true);
      setStatus(boxLabel(box));
      return;
    }
    if (row){
      const p = svgPoint(svg, e.clientX, e.clientY);
      const rp = snapPoint(p.x, p.y); row.x2 = rp.x; row.y2 = rp.y;
      const { pts, len, gap } = rowPoints(row);
      const shape = KIT[pending].draw();
      const gs = iconScale(pending), sfx = gs === 1 ? "" : ` scale(${gs})`;
      svg.querySelector(".ghost-layer").innerHTML =
        `<line x1="${row.x1}" y1="${row.y1}" x2="${row.x2}" y2="${row.y2}"
               stroke="rgba(74,222,128,0.7)" stroke-width="0.4" stroke-dasharray="2 2"/>` +
        pts.map(pt => {
          const c = clampItem(key, pt.x, pt.y, pending, 0);
          return `<g transform="translate(${c.x} ${c.y})${sfx}" opacity="0.6">${shape}</g>`;
        }).join("");
      setStatus(`${pts.length} × ${KIT[pending].name} · ${(gap/U).toFixed(1)} yd apart · ${(len/U).toFixed(1)} yd long`);
      return;
    }
    if (spin){
      const p = svgPoint(svg, e.clientX, e.clientY);
      const a = Math.atan2(p.y - spin.it.y, p.x - spin.it.x) * 180 / Math.PI;
      let r = spin.start + (a - spin.a0);
      if (snap) r = Math.round(r / 15) * 15;          // 15° steps while Snap is on
      r = ((r % 360) + 360) % 360;
      if (Math.abs(r - (spin.it.rot || 0)) > 0.001) spin.changed = true;
      spin.it.rot = r;
      spin.g.setAttribute("transform", itemTransform(spin.it));
      setStatus(`Rotating — ${Math.round(r)}°`);
      return;
    }
    if (draw){
      const p = svgPoint(svg, e.clientX, e.clientY);
      const dp = snapPoint(p.x, p.y); draw.x2 = dp.x; draw.y2 = dp.y;
      svg.querySelector(".ghost-layer").innerHTML =
        `<line x1="${draw.x1}" y1="${draw.y1}" x2="${draw.x2}" y2="${draw.y2}" stroke="${tapeColor}"
               stroke-width="${tapeWidth()}" stroke-linecap="round" opacity="0.85"${tapeDashed?' stroke-dasharray="3 2"':""}/>`;
      return;
    }
    if (guides){
      const p = svgPoint(svg, e.clientX, e.clientY);
      const dp = snapPoint(p.x, p.y); guides.x2 = dp.x; guides.y2 = dp.y;
      svg.querySelector(".ghost-layer").innerHTML =
        `<line x1="${guides.x1}" y1="${guides.y1}" x2="${guides.x2}" y2="${guides.y2}" stroke="rgba(255,255,255,0.6)"
               stroke-width="0.55" stroke-linecap="round" opacity="0.85" stroke-dasharray="2.5 2.5"/>`;
      return;
    }
    if (drag){
      const p = svgPoint(svg, e.clientX, e.clientY);
      const a = resolve(key, drag.it.id, drag.it.type, drag.it.rot, p.x - drag.ox, p.y - drag.oy);
      const nx = { x:a.x, y:a.y };
      drag.cx = e.clientX; drag.cy = e.clientY;
      // once the pointer has actually travelled, this is a move — cancel the
      // hold timer so it can no longer flip the gesture into a rotate
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 3){ drag.moved = true; endHold(); }
      drag.it.x = nx.x; drag.it.y = nx.y;
      drag.g.setAttribute("transform", itemTransform(drag.it));

      const f = FIELDS[key], G = 'stroke="rgba(74,222,128,0.8)" stroke-width="0.4" stroke-dasharray="2 2"';
      svg.querySelector(".ghost-layer").innerHTML =
        (a.gx !== null ? `<line x1="${a.gx}" y1="${f.ay0}" x2="${a.gx}" y2="${f.ay1}" ${G}/>` : "") +
        (a.gy !== null ? `<line x1="${f.ax0}" y1="${a.gy}" x2="${f.ax1}" y2="${a.gy}" ${G}/>` : "");
      if (a.gx !== null || a.gy !== null) setStatus("Aligned");
    }
  });

  svg.addEventListener("pointerup", e => {
    if (sketch){
      svg.querySelector(".ghost-layer").innerHTML = "";
      if (sketch.moved) runSketchEnd();
      else { const s = sketch; sketch = null; runClick(s.e, s.p); }
      return;
    }
    if (pan){
      const wasMoved = pan.moved;
      endPan();
      if (wasMoved) setStatus("Ready");
      return;
    }
    if (box){
      const n = normBox(box);
      const flat = (n.x2 - n.x1) < U - 1e-6 || (n.y2 - n.y1) < U - 1e-6;
      box = null;
      if (flat){                                  // a click, or a sliver — not a box
        boxSel = null; renderSel();
        setStatus("Drag out at least one square");
        return;
      }
      boxSel = { key, ...n };
      renderSel();
      setStatus(`${boxLabel(boxSel)} — build it with tape or cones`);
      return;
    }
    if (row){
      svg.querySelector(".ghost-layer").innerHTML = "";
      const { pts, gap } = rowPoints(row);
      // a bundle in row mode lays its single member, not five per stop
      const rt = KIT[pending].bundle ? KIT[pending].bundle.type : pending;
      pts.forEach(pt => {
        const c0 = clampItem(key, pt.x, pt.y, rt, rowRot);
        // each one sees the ones already dropped, so a tight row fans out
        const c = freeSpot(key, null, rt, rowRot, c0.x, c0.y);
        pushItem(key, rt, c.x, c.y, rowRot);
      });
      renderField(key); pushHistory();
      setStatus(`Placed ${pts.length} × ${KIT[rt].name}` + (pts.length > 1 ? ` at ${(gap/U).toFixed(1)} yd spacing` : ""));
      row = null; return;
    }
    if (spin){
      svg.querySelector(".ghost-layer").innerHTML = "";
      const it = spin.it;
      const p = clampItem(key, it.x, it.y, it.type, it.rot);
      it.x = p.x; it.y = p.y;
      renderField(key);
      if (spin.changed){ pushHistory(); setStatus(`Rotated to ${Math.round(it.rot)}°`); }
      spin = null; return;
    }
    if (draw){
      svg.querySelector(".ghost-layer").innerHTML = "";
      const len = Math.hypot(draw.x2-draw.x1, draw.y2-draw.y1);
      if (len >= 1.5){
        state[key].tape.push({ id:"t"+(uid++), x1:draw.x1, y1:draw.y1, x2:draw.x2, y2:draw.y2,
                               color:tapeColor, dashed:tapeDashed, type:lineType });
        renderField(key); pushHistory();
        setStatus(`Tape line — ${(len/U).toFixed(1)} yd`);
      }
      draw = null; return;
    }
    if (guides){
      svg.querySelector(".ghost-layer").innerHTML = "";
      const len = Math.hypot(guides.x2-guides.x1, guides.y2-guides.y1);
      if (len >= 1.5){
        if (!state[key].guides) state[key].guides = [];
        state[key].guides.push({ id:"g"+(uid++), x1:guides.x1, y1:guides.y1, x2:guides.x2, y2:guides.y2 });
        renderField(key); pushHistory();
        setStatus(`Guide line added — ${(len/U).toFixed(1)} yd`);
      }
      guides = null; return;
    }
    if (drag){
      endHold();
      drag.g.style.opacity = "";
      svg.querySelector(".ghost-layer").innerHTML = "";
      if (drag.moved){ renderField(key); pushHistory(); setStatus("Moved"); }
      else {
        state[key].items = state[key].items.filter(i => i.id !== drag.it.id);
        renderField(key); pushHistory(); setStatus("Item removed");
      }
      drag = null;
    }
  });

  svg.addEventListener("pointercancel", () => {
    endPan();
    draw = null; spin = null; row = null; sketch = null;
    if (box){ box = null; renderSel(); }
    if (drag){ endHold(); drag.g.style.opacity = ""; drag = null; }
    svg.querySelector(".ghost-layer").innerHTML = "";
  });
}

/* ============================================================
   SIMULATION PLAYBACK
   Everything moves at a constant speed along its own polyline, so the timing
   reads like a real drill: a 30 yd pass takes twice as long as a 15 yd one, and
   a player covers ground at running pace rather than at the speed of a pass.

   The clock is SECONDS, not distance along the ball path. That is the whole
   reason players and ball can share a drill: each mover converts the shared time
   into its own distance at its own speed, and a run triggered off a stop simply
   starts later on the same clock. Driving everything off the ball's distance
   would make "go when the pass is played" impossible to express.

   Paths are measured once at start and frozen for the run. Freezing matters now
   that players move: without it the ball would chase a receiver who has set off,
   the leg would stretch under it, and constant speed would stop being constant.
   ============================================================ */
let sim = null;   // { key, t, dur, ball, movers, pose, raf, last, paused }
const L_REACH = 3 * U;             // light the receiving foot over the last 3 yd

/* Where a player actually is at this instant. Playback writes poses here and
   never back into the state, so the drill is untouched by watching it: stopping
   puts everyone back on their marks with no undo entry and nothing to restore. */
function livePose(it){
  const p = sim && sim.pose[it.id];
  return p || { x: it.x, y: it.y, rot: it.rot || 0 };
}

function ballMarkup(x, y){
  return `<circle cx="${x}" cy="${y}" r="1.5" fill="rgba(0,0,0,0.35)" opacity="0.5"/>
          <circle cx="${x}" cy="${y}" r="1.15" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.28"/>
          <circle cx="${x}" cy="${y}" r="0.42" fill="#1a1a1a"/>`;
}
/* The foot currently on the ball, lit up on the player's own marker. Drawn into
   the play layer beside the ball rather than by re-rendering the item, because
   this changes every frame and re-rendering items mid-animation would throw away
   any drag in progress. */
function footMarkup(key, node){
  if (!node || node.k !== "i" || !node.foot) return "";
  const it = state[key].items.find(i => i.id === node.id);
  if (!it) return "";
  const s = studPos(it, node.foot);
  return `<circle cx="${s.x.toFixed(2)}" cy="${s.y.toFixed(2)}" r="${(STUD_R + 0.36).toFixed(2)}"
                  fill="none" stroke="${FOOT_LIT}" stroke-width="0.28" opacity="0.9"/>
          <circle cx="${s.x.toFixed(2)}" cy="${s.y.toFixed(2)}" r="${STUD_R}" fill="${FOOT_LIT}"/>`;
}
function drawBall(key, x, y, node){
  const l = svgs[key].querySelector(".play-layer");
  if (l) l.innerHTML = footMarkup(key, node) + ballMarkup(x, y);
}
function clearBall(key){
  const l = svgs[key].querySelector(".play-layer");
  if (l) l.innerHTML = "";
}

/* Legs carry the node they end on, not just the point, so playback can tell that
   the ball is arriving at somebody's left foot and light it. Zero-length legs are
   dropped, which is why the node travels on the leg rather than being looked up
   by index afterwards — the two lists would not line up.

   `stopAt` is the cumulative distance at each STOP, counted including the stops
   a zero-length leg collapsed away. Triggers name a stop, so leg indices and stop
   indices must never be mistaken for each other: a drill with two stops on the
   same spot has fewer legs than stops, and a trigger read off the wrong list
   would fire at the wrong moment. */
function buildLegs(key){
  const res = seqResolved(key);
  const pts = res.map(r => r.p), nodes = res.map(r => r.n);
  const { legs, total } = legsFrom(pts, nodes);
  const stopAt = [];
  let d = 0;
  for (let i = 0; i < pts.length; i++){
    if (i > 0) d += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
    stopAt.push(d);
  }
  return { pts, legs, total, stopAt };
}

/* Every player who moves, resolved once when Play is pressed and then frozen
   alongside the ball. A run whose trigger names a stop that is not there — the
   stop was deleted, or the drill was built the other way round — is clamped to
   the nearest real one rather than dropped, so the run still happens instead of
   silently disappearing from the drill. */
function buildMovers(key, ballSpeed, stopAt){
  const out = [];
  for (const it of state[key].items){
    const pts = runPoints(it);
    if (!pts) continue;
    const { legs, total } = legsFrom(pts);
    if (!legs.length) continue;
    const trig = it.run.trig || {};
    const si = stopAt.length ? Math.max(0, Math.min(stopAt.length - 1, trig.stop | 0)) : -1;
    const start = (si < 0 ? 0 : stopAt[si] / ballSpeed) + (+trig.delay || 0);
    const speed = (+it.run.speed || RUN_SPEED) * U;
    out.push({ id: it.id, type: it.type, rot0: it.rot || 0,
               legs, total, speed, start, end: start + total / speed });
  }
  return out;
}

/* Units, frozen at kick-off the same way the ball path and every run are.

   Rest positions are captured ONCE here rather than read from the state each
   frame. A unit that read live positions would be reading its own output — the
   block would shift, that shift would become the new rest, and the whole thing
   would walk off down the pitch. Freezing also means a squeeze relaxes back to
   the shape the coach drew rather than to whatever last frame left behind.

   Members who have a run of their own are dropped here, not skipped later, so
   that the rest centroid a policy works from is the centroid of the players who
   are actually holding the shape. */
function buildUnits(key, moverIds){
  const out = [];
  for (const u of unitsOf(key)){
    const rest = unitItems(key, u)
      .filter(it => !moverIds.has(it.id))
      .map(it => ({ id:it.id, x:it.x, y:it.y, type:it.type, rot:it.rot || 0 }));
    if (!rest.length) continue;
    out.push({ id:u.id, policy:u.policy || SHAPE_DEFAULT, amount:u.amount,
               lag: Math.max(0, +u.lag || 0), rest });
  }
  return out;
}

function syncPlayBtn(){
  const b = $("#playBtn");
  b.textContent = (sim && !sim.paused) ? "❚❚ Pause" : "▶ Play";
  b.classList.toggle("on", !!(sim && !sim.paused));
}

function simStop(){
  if (!sim) return;
  cancelAnimationFrame(sim.raf);
  // a unit poses its members exactly as a run does, so it needs putting back too
  const key = sim.key, moved = sim.movers.length > 0 || sim.units.length > 0;
  clearBall(key);
  // restore path visibility when stopping simulation
  svgs[key].querySelector(".path-layer").style.display = "";
  sim = null;
  /* Re-render only if somebody actually ran. Playback moves runners by writing
     transforms straight onto their nodes, so those nodes are the one thing left
     out of step with the state when the sim ends; a drill with no runs has
     nothing to put back and re-rendering it would needlessly drop the selection. */
  if (moved) renderField(key);
  syncPlayBtn();
}

/* Pose every runner for time `t` by writing transforms directly onto the existing
   item nodes. Deliberately not a re-render: renderField rebuilds the item layer,
   which would tear out the very nodes the pointer handlers are holding and clear
   the selection sixty times a second. Poses are recorded in sim.pose as well, so
   anything that needs to know where a player really is right now — the foot
   highlight, most of all — can ask livePose instead of reading stale state. */
/* Where the ball is at an arbitrary time, which is not the same question as
   "where do I draw the ball this frame". Units ask it about a moment slightly in
   the past, so it has to answer for any time rather than only for now. */
function ballAtTime(tt){
  if (!sim || !sim.legs.length) return null;
  return pointOn(sim.legs, Math.min(sim.total, Math.max(0, tt) * sim.speed));
}

function applyPoses(t){
  const layer = svgs[sim.key].querySelector(".item-layer");
  for (const m of sim.movers){
    // before the trigger fires the player is still standing on their mark
    const local = Math.max(0, Math.min(m.total, (t - m.start) * m.speed));
    const p = pointOn(m.legs, local);
    const L = m.legs.find(g => local <= g.at + g.len) || m.legs[m.legs.length - 1];
    // a player turns to face the way they are going, but not before they set off
    const rot = (t < m.start) ? m.rot0 : headingDeg(L.a, L.b);
    sim.pose[m.id] = { x: p.x, y: p.y, rot };
    const g = layer && layer.querySelector(`.item[data-id="${m.id}"]`);
    if (g) g.setAttribute("transform", poseTransform(m.type, p.x, p.y, rot));
  }
  /* Units after runs, and only over players a run did not already claim. The
     reaction lag is the whole difference between a defence and a magnet: the
     block answers where the ball WAS a fraction of a second ago, so it is always
     chasing rather than arriving with the pass. */
  for (const u of sim.units){
    const pose = shapePose(sim.key, u, u.rest, ballAtTime(t - u.lag));
    for (const r of u.rest){
      const p = pose.get(r.id);
      if (!p) continue;
      /* A defender watches the ball. Facing is taken from the live ball rather
         than from the lagged one the feet are reacting to — you turn your head
         before your body goes, and taking both from the delayed position makes
         the whole unit look asleep. */
      const b = ballAtTime(t);
      const rot = b ? headingDeg(p, b) : r.rot;
      sim.pose[r.id] = { x:p.x, y:p.y, rot };
      const g = layer && layer.querySelector(`.item[data-id="${r.id}"]`);
      if (g) g.setAttribute("transform", poseTransform(r.type, p.x, p.y, rot));
    }
  }
  // the hulls follow the players they are drawn round
  renderUnits(sim.key);
}

/* One frame of the drill. Players are posed first and the ball drawn afterwards,
   because the foot highlight is positioned off the player's live pose — draw them
   the other way round and the highlight lands a frame behind the runner. */
/* A leg, re-aimed at where its two ends are RIGHT NOW. Poses have already been
   applied for this frame, so nodePos answers live.

   Only the geometry is live; the schedule is not. How far the ball has travelled
   by time t still comes from the distances measured at kick-off, because those
   distances are what run triggers fire off — let the schedule chase the runners
   and a run triggered by the pass would change the length of the pass that
   triggered it. So the ball keeps its timetable and merely arrives at the player
   rather than at the spot the player has left. */
function legLive(L){
  return { a: (L.tag0 && nodePos(sim.key, L.tag0)) || L.a,
           b: (L.tag  && nodePos(sim.key, L.tag))  || L.b };
}

function drawFrame(t){
  applyPoses(t);
  if (!sim.legs.length){ clearBall(sim.key); return; }   // runs but no ball path
  const d = Math.min(sim.total, t * sim.speed);
  const cur = sim.legs.find(L => d <= L.at + L.len) || sim.legs[sim.legs.length - 1];
  const e = legLive(cur), u = Math.max(0, Math.min(1, (d - cur.at) / cur.len));
  const p = { x: e.a.x + (e.b.x - e.a.x) * u, y: e.a.y + (e.b.y - e.a.y) * u };
  /* Light the receiving foot as the ball closes on it rather than the whole way
     down the leg, so on a long pass the highlight reads as "this is the foot it
     is arriving on" instead of glowing across the entire pitch. Once the ball has
     arrived the foot stays lit on the finished picture. */
  const lit = (d >= sim.total || L_REACH > cur.at + cur.len - d) ? cur.tag : null;
  drawBall(sim.key, p.x, p.y, lit);
}

function simTick(ts){
  if (!sim || sim.paused) return;
  const dt = Math.min(0.05, (ts - sim.last) / 1000);   // cap so a tab-out doesn't teleport it
  sim.last = ts;
  sim.t += dt;

  if (sim.t >= sim.dur){
    sim.t = sim.dur;
    drawFrame(sim.t);
    cancelAnimationFrame(sim.raf);
    sim.paused = true;
    syncPlayBtn();
    setStatus(`Drill complete — ${(sim.total / U).toFixed(1)} yd travelled`);
    return;
  }
  drawFrame(sim.t);
  if (sim.legs.length){
    const d = sim.t * sim.speed;
    const leg = sim.legs.findIndex(L => d <= L.at + L.len);
    setStatus(`Playing — leg ${(leg < 0 ? sim.legs.length : leg + 1)} of ${sim.legs.length}`);
  } else {
    setStatus(`Playing — ${sim.t.toFixed(1)}s of ${sim.dur.toFixed(1)}s`);
  }
  sim.raf = requestAnimationFrame(simTick);
}

function simStart(key, fromZero){
  /* Stop first, measure second. Now that a stop on a player resolves to their
     LIVE pose, measuring the path while an old sim is still posing people would
     lay out the new one from wherever the last one happened to leave everybody —
     so pressing Restart mid-drill would quietly redraw the drill. */
  const keep = (!fromZero && sim && sim.key === key && sim.t < sim.dur) ? sim.t : 0;
  simStop();
  const built = buildLegs(key);
  const speed = (parseFloat($("#simSpeed").value) || 16) * U;   // yd/s -> units/s
  const movers = buildMovers(key, speed, built.stopAt);
  const units = buildUnits(key, new Set(movers.map(m => m.id)));
  /* A drill can be all ball, all running, or both. Only the case where nothing
     moves at all is refused, and the message names whichever half is missing.
     Units are not counted here: a formation with no ball to react to is a picture
     of a shape, not a drill, so it should still get the "no ball path" nudge. */
  if (!built.legs.length && !movers.length){
    setStatus(built.pts.length ? "Add at least two stops to play the drill"
                               : "No ball path yet — press B and click players in order");
    return;
  }
  /* The drill runs until the last thing moving has finished — the ball may still
     be in flight after every runner has arrived, or a late run may keep going
     long after the final pass. */
  const dur = Math.max(built.total / speed, ...movers.map(m => m.end), 0);
  sim = {
    key, pts: built.pts, legs: built.legs, total: built.total, stopAt: built.stopAt,
    movers, units, pose: {},
    t: keep, dur, paused: false, last: performance.now(),
    speed, raf: 0
  };
  syncPlayBtn();
  // hide the path layer if requested
  if (hidePathDuringPlay){
    svgs[key].querySelector(".path-layer").style.display = "none";
  }
  sim.raf = requestAnimationFrame(simTick);
}

function togglePlay(){
  if (sim && !sim.paused){                       // pause in place
    cancelAnimationFrame(sim.raf);
    sim.paused = true;
    syncPlayBtn();
    setStatus("Paused");
    return;
  }
  if (sim && sim.paused && sim.key === current && sim.t < sim.dur){
    sim.paused = false; sim.last = performance.now();
    syncPlayBtn();
    sim.raf = requestAnimationFrame(simTick);
    setStatus("Playing");
    return;
  }
  simStart(current, true);
}

/* ============================================================
   ZOOM  —  cursor-anchored, scroll-preserving
   ============================================================ */
let zoom = 1;
const ZMIN = 0.4, ZMAX = 5;

function applyZoom(){
  const f = FIELDS[current];
  inner.style.width  = Math.round(f.baseW * zoom) + "px";
  inner.style.height = Math.round(f.baseH * zoom) + "px";
  $("#zoomLbl").textContent = Math.round(zoom * 100) + "%";
}

/**
 * Zoom around a fixed screen point.
 * The whole bug in the old build was resizing first and letting the browser
 * clamp/reset scroll. Here we capture the content coordinate under the anchor
 * BEFORE the resize, then restore scroll so that coordinate stays put.
 */
function zoomTo(newZoom, anchorClientX, anchorClientY){
  newZoom = Math.min(ZMAX, Math.max(ZMIN, newZoom));
  if (Math.abs(newZoom - zoom) < 0.0001) return;

  const vr = viewport.getBoundingClientRect();
  // default anchor = centre of the viewport
  const ax = (anchorClientX == null ? vr.left + vr.width/2  : anchorClientX) - vr.left;
  const ay = (anchorClientY == null ? vr.top  + vr.height/2 : anchorClientY) - vr.top;

  // content-space point under the anchor, in un-zoomed units
  const cx = (viewport.scrollLeft + ax - inner.offsetLeft) / zoom;
  const cy = (viewport.scrollTop  + ay - inner.offsetTop ) / zoom;

  zoom = newZoom;
  applyZoom();
  void inner.offsetWidth;            // force layout so offsetLeft/Top are current

  viewport.scrollLeft = cx * zoom + inner.offsetLeft - ax;
  viewport.scrollTop  = cy * zoom + inner.offsetTop  - ay;
}

viewport.addEventListener("wheel", e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  zoomTo(zoom * factor, e.clientX, e.clientY);
}, { passive:false });

$("#zoomIn").onclick  = () => zoomTo(zoom * 1.2);
$("#zoomOut").onclick = () => zoomTo(zoom / 1.2);
$("#zoomFit").onclick = () => {
  const f = FIELDS[current];
  const availH = viewport.clientHeight - 40, availW = viewport.clientWidth - 40;
  if (availW <= 0 || availH <= 0) return;          // not laid out yet
  zoom = Math.max(ZMIN, Math.min(availW / f.baseW, availH / f.baseH, ZMAX));
  applyZoom();
  viewport.scrollLeft = 0; viewport.scrollTop = 0;
  setStatus("Fit to view");
};
