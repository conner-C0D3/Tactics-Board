<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccer Field Planner</title>
<style>
  :root{
    --bg:#0f1310;
    --surface-1:#171c18;
    --surface-2:#1f2620;
    --surface-3:#2a332b;
    --line:#37423a;
    --text:#e8efe9;
    --muted:#94a89a;
    --accent:#4ade80;
    --accent-dim:#22c55e;
    --danger:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  .app{display:flex;flex-direction:column;height:100vh}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;flex-direction:column;gap:0;background:var(--surface-1);
    border-bottom:1px solid var(--line);
  }
  .topbar-row{
    display:flex;align-items:center;gap:20px;padding:10px 14px;border-bottom:1px solid var(--line);
    overflow-x:auto;padding-right:20px;flex-wrap:nowrap;
    min-height:42px;
  }
  .topbar-row:last-child{
    border-bottom:none;
  }
  .topbar-row.modes{
    border-bottom:1px solid var(--line);
  }
  /* Spread out groups with flex-shrink: 0 to prevent wrapping */
  .topbar-row .group{
    flex-shrink:0;
    gap:8px;
    padding:0 8px;
  }
  .topbar-row .group + .group{
    padding-left:16px;border-left:1px solid var(--line);
  }
  .topbar-row .brand{
    flex-shrink:0;
    margin-right:auto;
  }
  /* Make controls more spacious */
  .topbar button, .topbar select, .topbar input[type=text]{
    padding:6px 12px;
  }
  .topbar .icon-btn{
    min-width:36px;padding:6px 10px;
  }
  .brand{font-weight:650;letter-spacing:.2px;margin-right:2px}
  .group{display:flex;align-items:center;gap:6px}
  .group + .group{padding-left:12px;border-left:1px solid var(--line)}
  /* T2: mode-specific options hide by default */
  #boxOpts, #runOpts, #shapeOpts, #rowOpts{display:none}
  body.mode-box #boxOpts{display:flex}
  body.mode-run #runOpts{display:flex}
  body.mode-shape #shapeOpts{display:flex}
  body.mode-row #rowOpts{display:flex}
  .grp-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-right:2px}
  .unit{font-size:12px;color:var(--muted)}
  #runWho{font-size:12px;font-weight:600;min-width:52px}

  button, select, input[type=text]{
    font:inherit;color:var(--text);
    background:var(--surface-2);border:1px solid var(--line);
    border-radius:7px;padding:5px 10px;cursor:pointer;
  }
  button:hover:not(:disabled){background:var(--surface-3)}
  button:disabled{opacity:.35;cursor:default}
  button.on{background:var(--accent-dim);border-color:var(--accent-dim);color:#07130b;font-weight:600}
  input[type=text],input[type=number]{cursor:text;width:130px;font:inherit;color:var(--text);
    background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
  select{cursor:pointer}
  .icon-btn{min-width:32px;text-align:center;padding:5px 8px}

  .swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
  .swatch.on{border-color:var(--text)}

  /* ---------- body ---------- */
  /* T2: New layout with left/right sidebars */
  .body{display:flex;flex:1;min-height:0}
  .sidebar{
    width:150px;flex:none;background:var(--surface-1);
    border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px;
  }
  .sidebar-right{
    width:180px;flex:none;background:var(--surface-1);
    border-left:1px solid var(--line);overflow-y:auto;
    display:flex;flex-direction:column;
  }
  .sidebar-tabs{
    display:flex;gap:2px;padding:8px;border-bottom:1px solid var(--line);
  }
  .sidebar-tab{
    flex:1;padding:6px 8px;font-size:11px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:6px;cursor:pointer;text-align:center;color:var(--muted);
  }
  .sidebar-tab.on{background:var(--accent-dim);color:#07130b;border-color:var(--accent-dim);font-weight:600}
  .sidebar-content{flex:1;overflow-y:auto;padding:8px}
  .sidebar-content-tab{display:none;height:100%}
  .sidebar-content-tab.on{display:block}
  .sb-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:6px 4px 6px}
  .kit{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:7px 8px;margin-bottom:5px;text-align:left;
    background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
    cursor:grab;user-select:none;
  }
  .kit:active{cursor:grabbing}
  .kit.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .kit svg{flex:none}
  .kit span{font-size:12.5px;line-height:1.2;flex:1;min-width:0}
  .kit small{display:block;color:var(--muted);font-size:10.5px}
  /* colour variants get a chip grid — only the colour differs, so a name
     on every row would be six lines of noise */
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin:0 4px 8px}
  .kit.chip{width:34px;height:34px;padding:0;margin:0;justify-content:center;position:relative}
  .kit.chip svg{background:rgba(0,0,0,0.25);border-radius:4px}
  /* how many are on this field — information, not a limit */
  .cnt{font-style:normal;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
  .kit.chip .cnt{position:absolute;top:-3px;right:-3px;min-width:14px;line-height:14px;
    text-align:center;border-radius:7px;background:var(--surface-3);color:var(--text);
    box-shadow:0 0 0 1px var(--line)}
  .cnt:empty{display:none}
  .cnt.over{color:#fbbf24;font-weight:600}

  .stage{display:flex;flex-direction:column;flex:1;min-width:0}
  .stagebar{
    display:flex;align-items:center;gap:10px;
    padding:6px 12px;border-bottom:1px solid var(--line);background:var(--surface-1);
  }
  #fieldTabs{display:flex;align-items:center;gap:10px}
  #rotateBtn{padding:5px 10px;font-size:12px}
  .tab{padding:5px 12px;border-radius:7px;background:transparent;border:1px solid transparent;color:var(--muted);
       display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;text-align:left}
  .tab.on{background:var(--surface-3);border-color:var(--line);color:var(--text);font-weight:600}
  /* Every pitch is landscape now and fit-to-view scales each one to fill the
     window, so Main Field and Small Sided read almost the same on screen. The
     dimensions are the thing that actually tells them apart, so they go on the
     tab rather than being something you have to remember. */
  .tab .dim{font-size:10px;font-weight:400;color:var(--muted);letter-spacing:.02em}
  .tab.on .dim{color:var(--muted)}
  .status{margin-left:auto;color:var(--muted);font-size:12.5px;min-height:18px}

  .viewport{
    flex:1;min-height:0;overflow:auto;position:relative;
    background:
      radial-gradient(1200px 500px at 50% -10%, #1b241d 0%, var(--bg) 70%);
    padding:20px;
  }
  .inner{margin:0 auto;line-height:0}
  .inner svg{display:block;width:100%;height:100%;touch-action:none}
  .field-wrap{display:none}
  .field-wrap.on{display:block;width:100%;height:100%}

  .item{cursor:grab}
  .item:hover{filter:brightness(1.25)}
  .tape-hit{stroke:transparent;stroke-width:4;fill:none;cursor:pointer}
  .drawing .item{cursor:crosshair}
  .drawing .inner svg{cursor:crosshair}
  .ball-mode .item{cursor:pointer}
  .ball-mode .inner svg{cursor:crosshair}
  .stop-hit{fill:transparent;cursor:pointer}
  .box-mode .inner svg,.box-mode .item{cursor:crosshair}
  #boxDims{font-size:11.5px;color:var(--muted);min-width:112px;text-align:center;
           font-variant-numeric:tabular-nums}
  #boxDims.live{color:#4ade80;font-weight:600}
  button[disabled]{opacity:0.4;cursor:default}

  /* empty grass is grabbable for panning when no tool is armed */
  .inner svg{cursor:grab}
  .armed .inner svg{cursor:copy}
  body.panning .inner svg,
  body.panning .item,
  body.panning *{cursor:grabbing!important}

  kbd{background:var(--surface-3);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}

  /* ---------- session plan ---------- */
  /* T2-5: Move sessionbar to right sidebar */
  .sessionbar{flex:none;border-top:1px solid var(--line);background:var(--surface-1);
              max-height:38vh;display:flex;flex-direction:column;display:none}
  .sesbar-head{display:flex;align-items:center;gap:6px;padding:6px 12px;flex-wrap:wrap}
  .sesbar-head .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  .ses-total{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  /* A horizontal run of cards: a session is a running order, and reading it left
     to right is the same gesture as reading it down a page. It scrolls rather
     than wrapping so the pitch above never loses more height as the plan grows. */
  .sesblocks{display:flex;gap:8px;overflow-x:auto;padding:0 12px 10px;align-items:flex-start}
  .sesblocks:empty::after{content:"No drills yet — name a setup above, then Add drill.";
                          color:var(--muted);font-size:12.5px;padding:2px 0 8px}
  .sblock{flex:none;width:186px;background:var(--surface-2);border:1px solid var(--line);
          border-radius:9px;padding:7px 8px;display:flex;flex-direction:column;gap:5px}
  .sblock.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .sblock.gone{border-color:#7f5539}
  .sblock .row{display:flex;align-items:center;gap:5px}
  .sblock .ord{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:14px}
  .sblock .who{flex:1;min-width:0;text-align:left;background:none;border:none;padding:2px 0;
               font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sblock.gone .who{color:#e9a06a;font-weight:500;font-style:italic}
  .sblock .mins{width:52px;padding:3px 6px}
  .sblock textarea{width:100%;min-height:38px;resize:vertical;font:inherit;font-size:12px;
                   color:var(--text);background:var(--surface-1);border:1px solid var(--line);
                   border-radius:6px;padding:4px 6px}
  .sblock .clock{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .sblock .mini{min-width:24px;padding:2px 6px;font-size:12px;line-height:1.1}

  @media print{
    .topbar,.sidebar,.stagebar,.sessionbar{display:none!important}
    body{background:#fff}
    .viewport{overflow:visible;padding:0}
  }
  /* The printed plan lives in the document rather than a popup: a blocked popup
     is a silent failure, and printing what is already on the page also means the
     browser's own print preview shows exactly what comes out. */
  #planSheet{display:none}
  body.printing-plan .app{display:none}
  body.printing-plan #planSheet{display:block;background:#fff;color:#111;padding:18px}
  #planSheet h1{font-size:19px;margin:0 0 2px}
  #planSheet .sub{font-size:12px;color:#555;margin-bottom:12px}
  #planSheet .card{display:flex;gap:12px;align-items:flex-start;padding:10px 0;
                   border-top:1px solid #ddd;break-inside:avoid;page-break-inside:avoid}
  #planSheet .card .pic{width:330px;flex:none}
  #planSheet .card .pic svg{width:100%;height:auto;display:block;border:1px solid #ccc}
  #planSheet .card h2{font-size:14px;margin:0 0 3px}
  #planSheet .card .meta{font-size:11.5px;color:#555;margin-bottom:5px}
  #planSheet .card p{font-size:12.5px;margin:0;white-space:pre-wrap}
  #planSheet .card .none{color:#888;font-size:12px}

  /* Custom Field Modal */
  #customFieldModal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    z-index:1000;
  }
  #customFieldModal.show{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <!-- T2-1: Row 1 - Modes -->
    <div class="topbar-row modes">
      <div class="brand">Field Planner</div>
      <div class="group">
        <span class="grp-label">Mode</span>
        <button id="modeSelect" class="on" title="Click items to select them">Select</button>
        <button id="modeRow" title="Drag to place players, cones, or poles in a line">Row</button>
        <button id="modeBox" title="Drag to highlight a region">Box</button>
        <button id="modeTape" title="Drag to lay down and measure tape">Tape</button>
        <button id="modeGuides" title="Drag to draw permanent guide lines on the field">Guides</button>
        <button id="modeBall" title="Click stops in order. Click a player again to play the ball back to them. Right-click a stop to remove it, shift-click to name the foot.">Ball Path</button>
        <button id="modeRun" title="Click a player then click positions to create a run">Runs</button>
      </div>
    </div>

    <!-- T2-1: Row 2 - Actions -->
    <div class="topbar-row actions">
      <div class="group">
        <button id="undoBtn" class="icon-btn" title="Undo (Cmd/Ctrl+Z)">↶</button>
        <button id="redoBtn" class="icon-btn" title="Redo (Cmd/Ctrl+Shift+Z)">↷</button>
      </div>

      <div class="group">
        <span class="grp-label">Zoom</span>
        <button id="zoomOut" class="icon-btn" title="Zoom out">−</button>
        <span id="zoomLbl" style="min-width:44px;text-align:center;color:var(--muted)">100%</span>
        <button id="zoomIn" class="icon-btn" title="Zoom in">+</button>
        <button id="zoomFit" title="Zoom to fit the whole field on screen">Whole field</button>
      </div>

      <div class="group">
        <button id="measureBtn" title="Drag to measure distance">Measure</button>
        <button id="clearBtn" title="Remove all equipment from this field">Clear</button>
      </div>

      <div class="group">
        <button id="snapBtn" class="on" title="Snap to the 1-yard grid — corners and cell centres">Snap to grid</button>
        <button id="halfBtn" class="on" title="Drop on corners, cell centres, and halfway along any grid line — a full half-yard grid. Turn it off to snap to corners and cell centres only.">Half Grid</button>
      </div>

      <div class="group">
        <button id="gridBtn" class="on" title="Show the measurement grid">Grid</button>
        <button id="guidesBtn" class="on" title="Show dashed training guides">Guides</button>
      </div>

      <div class="group">
        <button id="boostBtn" title="Draw cones, poles, markers and balls bigger than life so you can see them. Their real footprint is unchanged.">Boost Icons</button>
        <button id="rotateBtn" title="Turn this field 90° clockwise. Everything on it — kit, tape and ball path — turns with it.">Rotate</button>
      </div>


      <div class="group">
        <span class="grp-label">Setups</span>
        <input type="text" id="setupName" placeholder="Setup name">
        <button id="saveSetup">Save</button>
        <select id="setupList"><option value="">— saved —</option></select>
        <button id="loadSetup">Load</button>
        <button id="delSetup" class="icon-btn" title="Delete setup">🗑</button>
      </div>

      <div class="group">
        <button id="exportPng">Export PNG</button>
        <button id="printBtn">Print</button>
      </div>
    </div>

    <!-- Mode-specific option groups (hidden by default, shown based on active mode) -->
    <div class="group" id="boxOpts">
      <span class="grp-label">Box</span>
      <span id="boxDims" title="Size of the highlighted area">no selection</span>
      <button id="boxTape" disabled>Build tape</button>
      <button id="boxCones" disabled>Build cones</button>
      <select id="boxSpacing" title="Cone spacing around the perimeter">
        <option value="1">1 yd</option>
        <option value="2" selected>2 yd</option>
        <option value="3">3 yd</option>
        <option value="5">5 yd</option>
      </select>
      <select id="boxCone" title="Which cone to use"></select>
      <button id="boxClear" class="icon-btn" title="Clear the selection (Esc)">✕</button>
    </div>

    <!-- Only meaningful while a player is armed in Run mode, so it stays hidden
         the rest of the time rather than sitting there greyed out with nothing
         to apply to. -->
    <div class="group" id="runOpts" style="display:none">
      <span class="grp-label">Run</span>
      <span id="runWho">—</span>
      <select id="runTrig" title="Which ball stop this run waits for"></select>
      <input type="number" id="runDelay" value="0" min="0" max="10" step="0.25"
             style="width:64px" title="Seconds after the ball leaves that stop">
      <span class="unit">s</span>
      <select id="runSpeed" title="How hard this player runs">
        <option value="3">Jog</option>
        <option value="6" selected>Run</option>
        <option value="9">Sprint</option>
      </select>
    </div>

    <!-- Stamping a formation is the only way to make a unit, so the picker and
         the per-unit controls live in one group: you always arrive at the second
         half of it through the first. -->
    <div class="group" id="shapeOpts">
      <span class="grp-label">Shape</span>
      <select id="formPick" title="Formation to stamp"></select>
      <select id="formSide" title="Which colour to stamp"></select>
      <select id="formEnd" title="Which goal this side is defending">
        <option value="0">defends left</option>
        <option value="1">defends right</option>
      </select>
      <button id="stampForm">Stamp</button>
      <span class="sep"></span>
      <select id="unitPick" title="Which unit these settings apply to"></select>
      <select id="unitPolicy" title="How this unit reacts to the ball"></select>
      <input type="range" id="unitAmt" min="0" max="1" step="0.05" value="0.5"
             style="width:72px" title="How strongly it reacts">
      <input type="number" id="unitLag" value="0.35" min="0" max="3" step="0.05"
             style="width:60px" title="How late it reacts, in seconds">
      <span class="unit">s</span>
      <button id="unitDrop" class="icon-btn" title="Ungroup this unit — the players stay">✕</button>
    </div>

    <div class="group" id="rowOpts">
      <span class="grp-label">Row</span>
      <select id="rowMode">
        <option value="gap">yd apart</option>
        <option value="count">total</option>
      </select>
      <input type="number" id="rowVal" value="5" min="1" max="60" step="1" style="width:62px">
      <button id="alignBtn" class="on" title="Snap into line with matching equipment while dragging">Align preview</button>
    </div>

  </div>

  <div class="body">
    <div class="sidebar" id="sidebar"></div>

    <div class="stage">
      <!-- T2-1: Mode options row - appears only when relevant mode is active -->
      <div class="topbar-row" id="modeOptionsRow" style="display:none;border-bottom:1px solid var(--line)">
        <!-- Row mode options -->
        <div class="group" id="rowOpts">
          <span class="grp-label">Row</span>
          <select id="rowMode" title="Spacing mode">
            <option value="gap">yd apart</option>
            <option value="count">total</option>
          </select>
          <input type="number" id="rowVal" value="5" min="1" max="60" step="1" style="width:62px">
          <button id="alignBtn" class="on" title="Snap into line with matching equipment while dragging">Align preview</button>
          <input type="number" id="rowRot" value="0" min="0" max="359" step="1" style="width:54px" title="Rotation for all equipment in the row">
          <span class="unit">°</span>
        </div>

        <!-- Tape mode options -->
        <div class="group" id="tapeOpts" style="display:none">
          <span class="grp-label">Tape</span>
          <button class="swatch on" data-color="#facc15" style="background:#facc15"></button>
          <button class="swatch" data-color="#ffffff" style="background:#ffffff"></button>
          <button class="swatch" data-color="#f97316" style="background:#f97316"></button>
          <button class="swatch" data-color="#38bdf8" style="background:#38bdf8"></button>
          <button id="yardageBtn" class="on" title="Show yardage on tape and measurement lines">Show yardage</button>
        </div>

        <!-- Ball Path and Run mode options -->
        <div class="group" id="simOpts" style="display:none">
          <span class="grp-label">Sim</span>
          <button id="playBtn">▶ Play</button>
          <button id="restartBtn" class="icon-btn" title="Restart from the first stop">⏮</button>
          <span class="grp-label">Game speed</span>
          <select id="simSpeed" title="How fast the ball and players move">
            <option value="8">Slow</option>
            <option value="16" selected>Normal</option>
            <option value="28">Fast</option>
          </select>
          <button id="clearPath" title="Delete the ball path on this field">Clear Path</button>
          <button id="hidePathBtn" title="Hide ball path arrows during playback">Hide Path</button>
        </div>

        <div class="group" id="runOpts" style="display:none">
          <span class="grp-label">Run</span>
          <span id="runWho">—</span>
          <select id="runTrig" title="Which ball stop this run waits for"></select>
          <input type="number" id="runDelay" value="0" min="0" max="10" step="0.25" style="width:64px" title="Seconds after the ball leaves that stop">
          <span class="unit">s</span>
          <select id="runSpeed" title="How hard this player runs">
            <option value="3">Jog</option>
            <option value="6" selected>Run</option>
            <option value="9">Sprint</option>
          </select>
        </div>
      </div>

      <div class="stagebar">
        <!-- one tab per entry in FIELDS, built at startup -->
        <span id="fieldTabs"></span>
        <!-- acts on whichever pitch is showing; four clicks come back round -->
        <button id="rotateBtn" title="Turn this field 90° clockwise. Everything on it — kit, tape and ball path — turns with it.">⟳ Rotate</button>
        <button id="finalizeFieldBtn" style="display:none" title="Save this custom field as a template">Save Field</button>
        <div class="status" id="status">Ready</div>
      </div>

      <div class="viewport" id="viewport">
        <div class="inner" id="inner"></div>
      </div>

      <!-- The session plan, under the pitch: the running order of an evening.
           A block names a saved setup rather than carrying a copy of one, so a
           drill fixed once is fixed everywhere it is used. Clicking a block puts
           it on the pitch, which makes building the plan and walking through it
           the same control rather than two modes to remember. -->
      <div class="sessionbar" id="sessionbar">
        <div class="sesbar-head">
          <span class="grp-label">Session</span>
          <input type="text" id="sesName" placeholder="Session name">
          <button id="sesSave">Save</button>
          <select id="sesList"><option value="">— saved —</option></select>
          <button id="sesLoad">Load</button>
          <button id="sesDel" class="icon-btn" title="Delete session">🗑</button>
          <span class="sep"></span>
          <button id="sesAdd" title="Add the setup named in the toolbar as the next block">+ Add drill</button>
          <button id="sesPrev" class="icon-btn" title="Previous drill">◀</button>
          <button id="sesNext" class="icon-btn" title="Next drill">▶</button>
          <button id="sesPrint">Print plan</button>
          <span class="sep"></span>
          <span id="sesTotal" class="ses-total">empty</span>
        </div>
        <div class="sesblocks" id="sesBlocks"></div>
      </div>

    </div>

    <!-- T2: Right sidebar with tabs for Notes, Session, Equipment -->
    <div class="sidebar-right" id="sidebarRight">
      <div class="sidebar-tabs">
        <div class="sidebar-tab on" data-tab="notes">Notes</div>
        <div class="sidebar-tab" data-tab="session">Session</div>
        <div class="sidebar-tab" data-tab="equipment">Equipment</div>
      </div>
      <div class="sidebar-content">
        <div class="sidebar-content-tab on" id="notesPanel">
          <textarea style="width:100%;height:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--text);font-family:inherit;font-size:12px;resize:none" placeholder="Notes for this session..."></textarea>
        </div>
        <div class="sidebar-content-tab" id="sessionPanel">
          <div id="sessionContent"></div>
        </div>
        <div class="sidebar-content-tab" id="equipmentPanel">
          <div id="equipmentContent"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- filled in only while printing, and emptied again afterwards -->
<div id="planSheet"></div>

<!-- Custom Field Modal -->
<div id="customFieldModal">
  <div style="background:var(--surface-1); border:1px solid var(--line); border-radius:8px; padding:24px; max-width:400px; color:var(--text); font-family:inherit;">
    <div style="font-size:18px; font-weight:600; margin-bottom:16px;">Custom Field Dimensions</div>
    <div style="display:flex; gap:12px; margin-bottom:16px; align-items:flex-end;">
      <div style="flex:1;">
        <label style="display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:6px;">Width (yards)</label>
        <input type="number" id="customFieldWidth" style="width:100%; padding:8px 12px; background:var(--surface-2); border:1px solid var(--line); border-radius:5px; color:var(--text); font-family:inherit;" value="40" min="20" max="150">
      </div>
      <div style="font-weight:600; color:var(--muted);">×</div>
      <div style="flex:1;">
        <label style="display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:6px;">Length (yards)</label>
        <input type="number" id="customFieldLength" style="width:100%; padding:8px 12px; background:var(--surface-2); border:1px solid var(--line); border-radius:5px; color:var(--text); font-family:inherit;" value="60" min="30" max="200">
      </div>
    </div>
    <div style="display:flex; gap:12px;">
      <button id="customFieldCancel" style="flex:1; padding:8px 16px; background:var(--surface-2); border:1px solid var(--line); border-radius:5px; color:var(--text); cursor:pointer; font-family:inherit;">Cancel</button>
      <button id="customFieldCreate" style="flex:1; padding:8px 16px; background:var(--accent-dim); border:none; border-radius:5px; color:#07130b; font-weight:600; cursor:pointer; font-family:inherit;">Create</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   GEOMETRY  —  3 SVG units = 1 yard
   ============================================================ */
const U = 3; // units per yard

/* The top-left corner of every pitch, and the anchor of the snap grid, is this
   one point. The green surround outside the touchlines is expressed by moving
   the viewBox origin instead of moving the pitch, so ORIGIN never changes and
   every snap and clamp calculation downstream stays untouched. */
const ORIGIN = 10;

/* Pitches are declared in yards and everything below is derived, so the numbers
   here are the only place a size lives.

   Keep both the width and the length an even number of yards. A 68 yd width puts
   the touchlines at 10 and 214 and the centre at 112 — 34 grid squares in — and
   an even length puts the halfway line on a grid line. Odd numbers drift the
   centre marks off the grid, which is exactly the thing that made the penalty
   spot look wrong.

   The main field is 108 yd rather than something shorter so each half divides
   into three clean 18 yd bands: goal line to the top of the 18, the top of the 18
   to the dashed cross-pitch line, and that line to halfway. Shortening it breaks
   that spacing.

   `wYd` is the width goal line to goal line — the dimension the goals sit on —
   and `lYd` is the length between them. `land:true` turns the pitch on its side
   so the goals face left and right; the markings are laid out on an across/along
   axis rather than in screen x/y, so this is the only change needed. Every pitch
   is landscape, so every one carries the flag — it stays a per-field flag rather
   than becoming a constant, because a portrait pitch should still be one word away.

   `pad` is the green surround outside the touchlines, also in yards, and is
   always screen-relative: l/r/t/b mean left, right, top and bottom of the finished
   view whichever way the pitch faces. With every pitch on its side, left and right
   are behind the goals and top and bottom are outside the sidelines — which is
   where the deep working strips sit. That surround is real space, not decoration:
   the grass and the grid run right through it and equipment can be staged there,
   which is what a coach actually does with the area beside a pitch. Keep every
   number here a whole yard so the surround tiles into clean grid squares. */
const FIELDS = {
  big:   { wYd:68, lYd:108, pad:{ l:3, r:3, t:15, b:10 }, refs:true, land:true,
           label:"Main Field" },
  small: { wYd:68, lYd:86,  pad:{ l:2, r:2, t:2,  b:15 }, refs:true, land:true,
           label:"Small Sided" },
  /* Match dimensions: 70 x 118 yd, no training marks at all — just the pitch.
     The extra 2 yd of width sits outside the 18, and the extra 10 yd of length
     puts 41 yd between the top of the 18 and halfway instead of 36. */
  game:  { wYd:70, lYd:118, pad:{ l:2, r:2, t:4,  b:4 },  refs:false, land:true,
           label:"Game Field" }
};

/* Declared here, above the custom-field loading below, and not further down
   beside deriveField. The loading block calls deriveField on any field it
   restores from storage, deriveField reads PX_PER_UNIT, and a `const` cannot be
   read before the line that declares it has run. Leaving it below meant every
   boot threw "Cannot access 'PX_PER_UNIT' before initialization" and the pitch
   never drew. */
const PX_PER_UNIT = 1.6;        // on-screen size at 100% zoom

// Check for custom field from home page
try {
  const customFieldJSON = localStorage.getItem("customField");
  if (customFieldJSON) {
    const customField = JSON.parse(customFieldJSON);
    FIELDS.custom = customField;
  }
} catch (e) {
  console.error("Error loading custom field:", e);
}

// Load saved custom field templates
try {
  const savedFieldsJSON = localStorage.getItem("savedCustomFields");
  if (savedFieldsJSON) {
    const savedFields = JSON.parse(savedFieldsJSON);
    Object.assign(FIELDS, savedFields);
  }
} catch (e) {
  console.error("Error loading saved custom fields:", e);
}

// Initialize any newly loaded fields
for (const k in FIELDS){
  const f = FIELDS[k];
  if (!f.land0) { // Not yet initialized
    f.land = !!f.land;
    f.land0 = f.land;
    f.pad0 = f.pad;
    deriveField(f);
  }
}

/* The URL-parameter check that used to sit here has moved down to just after
   `current` and `fieldParam` are declared. Both are declared ~550 lines below
   this point, so reading them here threw "Cannot access 'fieldParam' before
   initialization" and killed the boot. */

/* Everything on a field is derived from `land` and `pad`, and both of those can
   change after boot — the Rotate button turns a pitch a quarter turn at a time.
   So this is a function rather than a one-shot loop: call it again and every
   bound, centre and pixel size downstream is brought back into agreement. */
function deriveField(f){
  // the pitch itself — top-left corner is the snap origin for every field
  const xYd = f.land ? f.lYd : f.wYd;
  const yYd = f.land ? f.wYd : f.lYd;
  f.x0 = ORIGIN;          f.y0 = ORIGIN;
  f.x1 = ORIGIN + xYd*U;  f.y1 = ORIGIN + yYd*U;
  // Centre of the pitch. Both dimensions are even numbers of yards, so this lands
  // on a grid intersection — which is what keeps the spots looking centred.
  f.cx = (f.x0 + f.x1) / 2;
  f.cy = (f.y0 + f.y1) / 2;
  // the full working area: pitch plus surround. This is what items clamp to.
  f.ax0 = f.x0 - f.pad.l*U;  f.ax1 = f.x1 + f.pad.r*U;
  f.ay0 = f.y0 - f.pad.t*U;  f.ay1 = f.y1 + f.pad.b*U;
  f.vbW = f.ax1 - f.ax0;     f.vbH = f.ay1 - f.ay0;
  f.baseW = Math.round(f.vbW * PX_PER_UNIT);
  f.baseH = Math.round(f.vbH * PX_PER_UNIT);
}
/* The declared orientation and surround are kept aside as the zero-turn state, so
   a pitch rotated three times and back is bit-for-bit what it started as rather
   than the accumulation of six flips. */
for (const k in FIELDS){
  const f = FIELDS[k];
  f.land = !!f.land;
  f.land0 = f.land;
  f.pad0 = f.pad;
  deriveField(f);
}
/* A quarter turn clockwise moves the bottom strip of grass round to the left, the
   left strip to the top, and so on. The pitch's own width and length never change
   — only which screen edge each surround sits against. */
const rotPad = p => ({ l:p.b, t:p.l, r:p.t, b:p.r });

function fieldMarkup(key){
  const f = FIELDS[key];
  const gid = "grass-"+key, grid = "grid-"+key;
  /* Two rectangles matter here. The pitch (x0,y0)-(x1,y1) carries every painted
     marking; the area (ax0,ay0)-(ax1,ay1) is the pitch plus its green surround
     and is what the viewBox shows. The pitch stays anchored at ORIGIN and the
     surround is bought by letting the viewBox origin go negative, so nothing
     downstream — snapping, clamping, saved setups — has to know about it. */
  const PW = f.x1 - f.x0, PH = f.y1 - f.y0;

  /* Markings are laid out on the pitch's own axes rather than in screen x/y:
     `a` runs ACROSS, goal line to goal line, and `l` runs ALONG, goal to goal.
     A landscape pitch is the same drawing with those two axes swapped, so every
     mark below is written once and comes out right whichever way it faces. */
  const AC = f.wYd*U, AL = f.lYd*U, MID = AC/2;
  const X = (a,l) => f.land ? f.x0 + l : f.x0 + a;
  const Y = (a,l) => f.land ? f.y0 + a : f.y0 + l;
  const rct = (a,l,da,dl,attr) =>
    `<rect x="${X(a,l)}" y="${Y(a,l)}" width="${f.land?dl:da}" height="${f.land?da:dl}" ${attr}/>`;
  const lin = (a1,l1,a2,l2,attr) =>
    `<line x1="${X(a1,l1)}" y1="${Y(a1,l1)}" x2="${X(a2,l2)}" y2="${Y(a2,l2)}" ${attr}/>`;
  const dot = (a,l,r) =>
    `<circle cx="${X(a,l)}" cy="${Y(a,l)}" r="${r}" fill="rgba(255,255,255,0.95)"/>`;

  // goal-line-relative depths, in units
  const BOX = 18*U, SIX = 6*U, SPOT = 12*U;
  // Pitch markings are painted lines on grass — they read as white, not grey,
  // so these sit near full opacity. The dashed training lines are deliberately
  // a step back from them, but still clearly visible.
  const S = 'stroke="rgba(255,255,255,0.92)" stroke-width="0.8" fill="none"';
  const S6 = 'stroke="rgba(255,255,255,0.92)" stroke-width="0.6" fill="none"';
  const SA = 'stroke="rgba(255,255,255,0.92)" stroke-width="0.8" fill="none"';
  const SC = 'stroke="rgba(255,255,255,0.92)" stroke-width="0.8" fill="none"';
  // dashed training reference lines
  const REF = 'stroke="rgba(255,255,255,0.72)" stroke-width="0.55" stroke-dasharray="2.5 2.5" fill="none"';
  /* Training marks. The Game Field opts out entirely (refs:false) — it is meant
     to look like a match pitch, nothing more. */
  let refs = "";
  if (f.refs){
    // corridors at the 18-yard box width — full length, goal line to goal line
    [MID-60, MID+60].forEach(a => refs += lin(a, 0, a, AL, REF));
    // corridors at the goal-area width — from the top of one 18 to the top of the other
    [MID-24, MID+24].forEach(a => refs += lin(a, BOX, a, AL-BOX, REF));
    // Main field only: across the pitch, 18 yd off the halfway line — which on a
    // 108 yd pitch is also exactly 18 yd off the top of the 18-yard box, so each
    // half reads as three equal thirds.
    if (key === "big"){
      [AL/2 - BOX, AL/2 + BOX].forEach(l =>
        refs += lin(0, l, AC, l, REF + ' data-cross="1"'));
    }
  }
  /* The D. Its mouth is set to 15.5 yd rather than the 16 yd a true 10-yard
     radius would give, so it reads as narrower than the 16 yd goal area instead
     of matching it exactly. The radius follows from the mouth: the arc springs
     off the top of the 18 (6 yd past the penalty spot), so
     r = hypot(half-mouth, 6 yd). Everything below is derived, so changing D_MOUTH
     is the only edit needed. */
  const D_MOUTH = 15.5;                       // yards, across the top of the D
  const DHW = D_MOUTH * U / 2;                // half-mouth in units
  const D_DY = 6 * U;                         // spot to the top of the box
  const DR  = Math.hypot(DHW, D_DY).toFixed(4);

  /* One goal end, mirrored for the other. 40 x 18 yd box, 16 x 6 yd goal area,
     spot 12 yd out, D mouth D_MOUTH yd springing off the top of the 18. */
  const end = near => {
    const bx = near ? 0 : AL - BOX;           // near edge of the 18-yard box
    const sx = near ? 0 : AL - SIX;           // near edge of the goal area
    const top  = near ? BOX  : AL - BOX;      // the line the D springs off
    const spot = near ? SPOT : AL - SPOT;
    /* The D always bulges toward the middle of the pitch. Which sweep flag does
       that depends on both which end this is and which way the pitch faces —
       swapping the axes reverses the winding. */
    const sweep = (f.land === near) ? 1 : 0;
    return rct(MID-60, bx, 120, BOX, S)
         + rct(MID-24, sx, 48, SIX, S6)
         + dot(MID, spot, 1)
         + `<path d="M ${X(MID-DHW,top)} ${Y(MID-DHW,top)} A ${DR} ${DR} 0 0 ${sweep}`
         + ` ${X(MID+DHW,top)} ${Y(MID+DHW,top)}" ${SA}/>`;
  };
  return `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="${f.ax0} ${f.ay0} ${f.vbW} ${f.vbH}" preserveAspectRatio="xMidYMid meet" data-field="${key}">
  <defs>
    <linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d5016"/><stop offset="100%" stop-color="#3a6b1f"/>
    </linearGradient>
    <!-- Just the 1-yard lines. Cell centres and line midpoints are still live
         snap targets — they are simply not drawn, because a tick at every
         half yard turns the pitch into graph paper. -->
    <pattern id="${grid}" x="${ORIGIN}" y="${ORIGIN}" width="${U}" height="${U}" patternUnits="userSpaceOnUse">
      <path d="M ${U} 0 L 0 0 0 ${U}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.2"/>
    </pattern>
    <marker id="arw-${key}" viewBox="0 0 10 10" refX="9" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <!-- Runs get their own, slimmer head in white. A coach reading the picture has
         to be able to tell at a glance which line is the ball and which is a person,
         and colour alone does that faster than following the line to its source. -->
    <marker id="run-${key}" viewBox="0 0 10 10" refX="9" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Grass and grid run edge to edge across the whole working area, surround
       included: the space outside the touchlines is somewhere to stage kit, not
       a decorative border. The pattern is anchored at ORIGIN and tiles outward,
       so the surround squares line up with the pitch squares for free. -->
  <rect class="area" x="${f.ax0}" y="${f.ay0}" width="${f.vbW}" height="${f.vbH}" fill="url(#${gid})"/>
  <rect x="${f.ax0}" y="${f.ay0}" width="${f.vbW}" height="${f.vbH}" fill="url(#${grid})"/>
  <!-- the touchline: the only thing that distinguishes pitch from surround -->
  <rect class="pitch" x="${f.x0}" y="${f.y0}" width="${PW}" height="${PH}" fill="none" stroke="#ffffff" stroke-width="1"/>

  <!-- the two goal ends, mirrored -->
  ${end(true)}
  ${end(false)}

  <!-- centre -->
  ${lin(0, AL/2, AC, AL/2, 'stroke="rgba(255,255,255,0.92)" stroke-width="1"')}
  <circle cx="${f.cx}" cy="${f.cy}" r="30" ${SC}/>
  ${dot(MID, AL/2, 1.5)}

  <g class="ref-lines">${refs}</g>

  <g class="tape-layer"></g>
  <!-- Under the runs and the ball: a unit hull is the ground a block covers, so
       it reads as territory rather than as another line drawn on top. -->
  <g class="unit-layer"></g>
  <g class="run-layer"></g>
  <g class="path-layer"></g>
  <g class="item-layer"></g>
  <g class="play-layer"></g>
  <g class="sel-layer"></g>
  <g class="ghost-layer"></g>
</svg>`;
}

/* ============================================================
   EQUIPMENT  —  drawn to scale
   ============================================================ */
/* Every shape below is drawn at true scale: `yd()` is the only conversion.
   Local origin is the centre of the item's footprint, and -y is "front" for
   anything that has a facing. */
const yd = v => v * U;

/* Sub-yard kit is only a pixel or two across when the whole field is on screen,
   so tiny items carry an invisible grab ring. It costs nothing at true scale
   and makes them clickable without inflating the real footprint. */
const grab = r => `<circle cx="0" cy="0" r="${r}" fill="transparent"/>`;

/* Pitch tape is 1/18 yd wide — about two thirds of an inch. At true scale that
   is a hairline, so Boost Icons thickens it along with the rest of the small
   kit. The dash pattern is a real length (1 yd on, ⅔ off) and never changes. */
const TAPE_W = yd(1/18);
const tapeWidth = () => boost ? TAPE_W * 4 : TAPE_W;

/* Press and hold this long on a piece of equipment and the drag turns into a
   rotate — the same gesture shift-drag gives you, without the keyboard. */
const HOLD_MS = 2000;

/* ---------- goals, seen from above ----------
   No arrow — the goal is drawn the way one actually looks from above and the
   facing falls out of the shape. Four cues stack up, front is -y:
     · the mouth is wide and the net tapers in toward the back
     · the front carries a solid crossbar with a post stub turned into the net
       at each end; the back rail is a thin dotted line
     · the netting darkens toward the closed back
     · the mouth itself is left open — no bar across the goal line but the
       crossbar, so the gap the ball goes through is the bright edge
   A rebounder plays from either side, so it is symmetric and gets two
   identical rails and no shading. */
function goalSVG(wYd, dYd, color, twoWay){
  const w = yd(wYd), d = yd(dYd), hw = w/2, hh = d/2;
  const back = twoWay ? hw : hw * 0.78;          // a real taper, not a hint
  const bar  = Math.max(0.45, d * 0.13);
  let net = "";
  const cols = Math.max(4, Math.round(wYd * 1.5));
  for (let i = 1; i < cols; i++){
    const t = i/cols;
    net += `<line x1="${(-hw + w*t).toFixed(2)}" y1="${-hh}" x2="${(-back + 2*back*t).toFixed(2)}" y2="${hh}"/>`;
  }
  const rows = Math.max(1, Math.round(dYd * 2));
  for (let j = 1; j < rows; j++){
    const t = j/rows, y = (-hh + d*t).toFixed(2), hx = (hw + (back-hw)*t).toFixed(2);
    net += `<line x1="${-hx}" y1="${y}" x2="${hx}" y2="${y}"/>`;
  }
  // rear third of the net, filled darker so the closed end reads as heavy
  const t0 = 0.62, xb = hw + (back - hw) * t0, yb = -hh + d * t0;
  const shade = twoWay ? "" :
    `<path d="M ${-xb.toFixed(2)} ${yb.toFixed(2)} L ${xb.toFixed(2)} ${yb.toFixed(2)}
              L ${back} ${hh} L ${-back} ${hh} Z" fill="rgba(0,0,0,0.42)"/>`;
  const rear = twoWay
    ? `<line x1="${-back}" y1="${hh}" x2="${back}" y2="${hh}" stroke="${color}" stroke-width="${bar}" stroke-linecap="round"/>`
    : `<line x1="${-back}" y1="${hh}" x2="${back}" y2="${hh}" stroke="${color}" stroke-width="${bar*0.34}"
             stroke-dasharray="${bar*0.8} ${bar*0.8}" opacity="0.75"/>`;
  // post stubs: the uprights, turned back into the net from each end of the mouth
  const posts = twoWay ? "" :
    [-1, 1].map(s => `<line x1="${(s*(hw - bar*0.35)).toFixed(2)}" y1="${-hh}"
                            x2="${(s*(hw - bar*0.35) + s*(back-hw)*0.34).toFixed(2)}" y2="${(-hh + d*0.34).toFixed(2)}"
                            stroke="${color}" stroke-width="${bar*0.8}" stroke-linecap="round"/>`).join("");
  return `<path d="M ${-hw} ${-hh} L ${hw} ${-hh} L ${back} ${hh} L ${-back} ${hh} Z"
                fill="rgba(0,0,0,0.32)" stroke="${color}" stroke-width="0.28" stroke-opacity="0.7"/>
          ${shade}
          <g stroke="${color}" stroke-width="0.16" opacity="0.5">${net}</g>
          ${posts}
          <line x1="${-hw}" y1="${-hh}" x2="${hw}" y2="${-hh}" stroke="${color}"
                stroke-width="${bar}" stroke-linecap="round"/>${rear}`;
}

/* ---------- cones, seen from above: concentric rings ---------- */
function coneSVG(color, wYd){
  const r = yd(wYd)/2;
  return grab(1.2) +
    `<circle cx="0" cy="0" r="${r}" fill="${color}" stroke="rgba(0,0,0,0.55)" stroke-width="${(r*0.16).toFixed(3)}"/>
     <circle cx="0" cy="0" r="${(r*0.58).toFixed(3)}" fill="rgba(255,255,255,0.34)"/>
     <circle cx="0" cy="0" r="${(r*0.24).toFixed(3)}" fill="rgba(0,0,0,0.38)"/>`;
}

/* ---------- slalom pole ----------
   Straight down from above a pole is just a 1/10 yd dot, which is unreadable and
   indistinguishable from a spot marker. So it is drawn leaning away from the
   viewer: the base circle sits on its true footprint at the origin and the shaft
   runs "up" the page, the way you'd see it standing on the grass. Only the base
   is real — the shaft overhangs, and rotating the pole swings the shaft round,
   which reads as the lean. */
const POLE_L = yd(0.75);                 // drawn shaft length, not a footprint (T0-5: 3/4 yard tall)
function poleSVG(color){
  const w = yd(0.1), hw = w/2, L = POLE_L;
  const band = (t, h) =>
    `<rect x="${-hw}" y="${(-L*t - h/2).toFixed(3)}" width="${w}" height="${h.toFixed(3)}"
           fill="rgba(0,0,0,0.45)"/>`;
  return `<rect x="${-hw-0.35}" y="${(-L-0.35).toFixed(2)}" width="${w+0.7}" height="${(L+0.7).toFixed(2)}"
                fill="transparent"/>
          <rect x="${(-hw+0.14).toFixed(3)}" y="${(-L+0.14).toFixed(3)}" width="${w}" height="${L.toFixed(3)}"
                rx="${hw}" fill="rgba(0,0,0,0.28)"/>
          <rect x="${-hw}" y="${(-L).toFixed(3)}" width="${w}" height="${L.toFixed(3)}"
                rx="${hw}" fill="${color}" stroke="rgba(0,0,0,0.6)" stroke-width="0.07"/>
          ${band(0.34, 0.34)}${band(0.66, 0.34)}
          <line x1="${(-hw*0.42).toFixed(3)}" y1="${(-L+0.3).toFixed(3)}"
                x2="${(-hw*0.42).toFixed(3)}" y2="-0.5"
                stroke="rgba(255,255,255,0.45)" stroke-width="0.06" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="${(hw*1.25).toFixed(3)}" fill="${color}"
                  stroke="rgba(0,0,0,0.7)" stroke-width="0.09"/>
          <circle cx="0" cy="0" r="${(hw*0.42).toFixed(3)}" fill="rgba(0,0,0,0.45)"/>`;
}

/* ---------- flat markers: the ball rolls straight over these ---------- */
function padSVG(color){
  const w = yd(0.46), h = yd(0.11);
  return grab(1.1) +
    `<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${h/2}"
           fill="${color}" fill-opacity="0.95" stroke="rgba(0,0,0,0.5)" stroke-width="0.07"/>
     <line x1="${-w/2 + h*0.6}" y1="0" x2="${w/2 - h*0.6}" y2="0"
           stroke="rgba(255,255,255,0.45)" stroke-width="${(h*0.22).toFixed(3)}"/>`;
}
function discSVG(color){
  const r = yd(0.25)/2;
  return grab(1.1) +
    `<circle cx="0" cy="0" r="${r}" fill="${color}" fill-opacity="0.95" stroke="rgba(0,0,0,0.5)" stroke-width="0.08"/>
     <circle cx="0" cy="0" r="${(r*0.52).toFixed(3)}" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.07"/>`;
}
// L-shaped boundary corner: 0.38 yd along each outer edge, ~2.75 in band
function cornerSVG(color){
  const s = yd(0.38), b = yd(0.0764), o = -s/2;
  return grab(1.1) +
    `<path d="M ${o} ${o} H ${(o+s).toFixed(3)} V ${(o+b).toFixed(3)} H ${(o+b).toFixed(3)}
              V ${(o+s).toFixed(3)} H ${o} Z"
           fill="${color}" fill-opacity="0.95" stroke="rgba(0,0,0,0.5)" stroke-width="0.07"/>`;
}

/* ---------- match ball, 8.6 in across ----------
   White with black panels and gold detailing. Drawn as a centre pentagon and
   the ring of five around it, which is what actually reads as a football from
   above — a scatter of dots just looks like spots. */
function ballSVG(){
  const r = yd(0.239)/2;
  const pent = (cx, cy, rad, rot) => {
    const p = [];
    for (let i = 0; i < 5; i++){
      const a = Math.PI*2*i/5 - Math.PI/2 + rot;
      p.push(`${(cx + Math.cos(a)*rad).toFixed(3)},${(cy + Math.sin(a)*rad).toFixed(3)}`);
    }
    return p.join(" ");
  };
  let out = grab(1.1) +
    `<circle cx="0" cy="0" r="${r}" fill="#ffffff" stroke="rgba(0,0,0,0.5)" stroke-width="${(r*0.1).toFixed(3)}"/>` +
    `<polygon points="${pent(0,0,r*0.36,0)}" fill="#151515"/>`;
  for (let i = 0; i < 5; i++){                    // the surrounding panels
    const a = Math.PI*2*i/5 - Math.PI/2 + Math.PI/5;
    out += `<polygon points="${pent(Math.cos(a)*r*0.74, Math.sin(a)*r*0.74, r*0.28, a + Math.PI/2)}" fill="#151515"/>`;
  }
  for (let i = 0; i < 5; i++){                    // gold seams between the panels
    const a = Math.PI*2*i/5 - Math.PI/2;
    out += `<line x1="${(Math.cos(a)*r*0.4).toFixed(3)}" y1="${(Math.sin(a)*r*0.4).toFixed(3)}"
                  x2="${(Math.cos(a)*r*0.84).toFixed(3)}" y2="${(Math.sin(a)*r*0.84).toFixed(3)}"
                  stroke="#d4a02a" stroke-width="${(r*0.1).toFixed(3)}" stroke-linecap="round"/>`;
  }
  return out;
}
/* Five balls sitting against each other, the way a bag of them gets tipped out
   next to a drill. BALL5_OFF is shared with the placement code so the preview
   and what lands on the grass are the same arrangement. */
const BALL_D = yd(0.239);                              // one ball across
const BALL5_OFF = [[-2,0],[-1,0],[0,0],[1,0],[2,0]].map(([a,b]) => [a*BALL_D, b*BALL_D]);
// sidebar preview only — the bundle places five separate balls on the field
function ball5SVG(){
  return BALL5_OFF.map(([x,y]) => `<g transform="translate(${x} ${y})">${ballSVG()}</g>`).join("");
}

function mannequinSVG(color){
  // Human figure from above, 1 yd across, 3/4 yard tall (T0-5)
  const w = yd(1), h = yd(0.75);
  const headR = yd(0.12), bodyW = yd(0.25), legL = yd(0.28);
  return `
    <!-- head -->
    <circle cx="0" cy="${-h/2 + headR}" r="${headR}" fill="${color}" stroke="rgba(0,0,0,0.5)" stroke-width="0.15"/>
    <!-- body -->
    <rect x="${-bodyW/2}" y="${-h/2 + headR*2.2}" width="${bodyW}" height="${yd(0.3)}"
          fill="${color}" stroke="rgba(0,0,0,0.5)" stroke-width="0.15"/>
    <!-- legs -->
    <line x1="${-yd(0.1)}" y1="${-h/2 + headR*4.2}" x2="${-yd(0.1)}" y2="${-h/2 + headR*4.2 + legL}"
          stroke="${color}" stroke-width="0.18" stroke-linecap="round"/>
    <line x1="${yd(0.1)}" y1="${-h/2 + headR*4.2}" x2="${yd(0.1)}" y2="${-h/2 + headR*4.2 + legL}"
          stroke="${color}" stroke-width="0.18" stroke-linecap="round"/>
  `;
}

/* A player is drawn to fit inside one 1-yard cell: the whole glyph, nose and all,
   stays under the 1.5-unit half-cell so a marker never spills into the neighbouring
   square. `dark` = the shirt is light, so the number, the studs and a heavier
   outline go dark — otherwise a white player disappears into the pitch markings.

   FACING. At rot = 0 a player faces UP the screen — local -y — which is the
   convention the mannequin already uses. A circle looks identical at every angle,
   so the facing has to break the SILHOUETTE rather than live inside it. Hence the
   nose: body and nose are one path, giving a teardrop that still reads as pointing
   somewhere when the marker is ten pixels across at fit-to-view. Interior detail
   would simply vanish at that size.

   FEET. Two studs flank the nose, left and right from the player's own point of
   view, so a drill can say which foot the ball is played with. They sit inside the
   body, costing no footprint, and they blur into the nose as you zoom out — which
   is the right way to fail, since at that scale nothing could show a foot. */
const PLAYER_R  = 0.75;                     // footprint half-extent — clamping uses this (1/2 yard wide)
const STUD_FWD  = -0.72, STUD_SIDE = 0.52, STUD_R = 0.25;
const FOOT_LIT  = "#fbbf24";                // the foot currently on the ball

/* The body is a teardrop INSCRIBED in the old 1.4 circle — pointed at the front,
   round at the back, never reaching further from the centre than the disc it
   replaces. That matters: players are spaced a minimum of 2 × PLAYER_R apart, so
   a nose that stuck out past 1.4 could poke into the next player when two of them
   faced each other. Same maximum radius as before means every spacing, clamping
   and containment guarantee in the app holds unchanged, and the facing comes free.
   The widest points sit at (±1.4, 0), exactly on that circle, so the back is a
   true semicircle centred on the marker rather than an arc hanging off it — get
   that wrong and the tail swings out past the footprint. The two sides are cubics
   from the widest point up to the tip, and both stay inside 1.4 the whole way. */
const PLAYER_BODY =
  `M 0 -1.40
   C 0.92 -1.28, 1.40 -0.62, 1.40 0
   A 1.40 1.40 0 0 1 -1.40 0
   C -1.40 -0.62, -0.92 -1.28, 0 -1.40 Z`;

function playerSVG(color, dark, n){
  const ink = dark ? "#10240f" : "#ffffff";
  const stud = sx =>
    `<circle cx="${(sx * STUD_SIDE).toFixed(3)}" cy="${STUD_FWD}" r="${STUD_R}"
             fill="${ink}" fill-opacity="0.78"/>`;
  // invisible grab ring: the marker is small, keep it easy to click and drag
  return `<circle cx="0" cy="0" r="1.8" fill="transparent"/>
          <path d="${PLAYER_BODY}" fill="${color}"
                stroke="rgba(0,0,0,${dark ? 0.8 : 0.55})" stroke-width="${dark ? 0.2 : 0.16}"
                stroke-linejoin="round"/>
          ${stud(-1)}${stud(1)}
          <text x="0" y="0.95" text-anchor="middle" font-family="sans-serif" font-size="1.6" font-weight="700"
                fill="${ink}">${n == null ? "" : n}</text>`;
}

/* A player's feet, in world coordinates. Derived from the player's own position
   and rotation rather than stored anywhere, which is what makes dragging a player
   — or turning the entire pitch with the Rotate button — carry their feet along
   with no extra bookkeeping and no chance of the two drifting apart.

   `footPos` is where the BALL rests when played with that foot, and it sits outside
   the body: a ball at your right foot is beside the foot, not inside your shin.
   `studPos` is the stud drawn on the marker, used to light up the foot in play. */
const FOOT_FWD = -2.35, FOOT_SIDE = 1.05;
/* Feet are read off the player's LIVE pose, not the stored one. Standing still
   those are the same thing, but a player running mid-drill is somewhere between
   their waypoints and their feet have to be there with them — otherwise the foot
   highlight stays behind at the spot they set off from. */
function localToWorld(it, lx, ly){
  const q = livePose(it);
  const t = q.rot * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
  return { x: q.x + lx*c - ly*s, y: q.y + lx*s + ly*c };
}
const footPos = (it, side) => localToWorld(it, (side === "L" ? -1 : 1) * FOOT_SIDE, FOOT_FWD);
const studPos = (it, side) => localToWorld(it, (side === "L" ? -1 : 1) * STUD_SIDE, STUD_FWD);

const CHIP_GROUPS = new Set(["Cones","LgCones","Poles","Pads","Discs","Corners"]);

/* Setups saved before the equipment overhaul still name the old kit. Map them
   onto the closest current item rather than silently dropping the items. */
const TYPE_ALIAS = {
  goalWhite:"goalFull", goalOrange:"goalFull",
  coneSmall:"coneOrange", coneLarge:"coneLgWhite"
};

/* ============================================================
   STATE
   ============================================================ */
/* Driven off FIELDS so a new pitch gets its own drawer of items automatically.

   `turns` is how many quarter turns clockwise this pitch has been rotated from the
   orientation it was declared with. It lives in the state rather than on the field
   so that undo, redo and saved setups carry it for free: a drill and the pitch it
   was drawn on are one thing, and restoring the cones onto a pitch facing the
   other way would put every one of them in the wrong place. */
function blankState(){
  const s = {};
  for (const k in FIELDS) s[k] = { items:[], tape:[], seq:[], units:[], guides:[], turns:0 };
  return s;
}
let state = blankState();
let current = "big";
// Store URL field parameter to check later after fields are loaded
const urlParams = new URLSearchParams(window.location.search);
const fieldParam = urlParams.get("field");
/* Applied here rather than up beside the custom-field loading, because `current`
   and `fieldParam` are declared on the two lines above — up there they are still
   in the temporal dead zone. FIELDS is fully populated by now, so a ?field= for
   a saved custom pitch resolves correctly. */
if (fieldParam && FIELDS[fieldParam]) current = fieldParam;
let mode = "select";              // "select" | "row" | "tape" | "ball"
let snap = true;
/* On by default: corners, cell centres AND the middle of every grid line, i.e.
   the full half-yard lattice. Turning it off narrows the snap back to corners
   and cell centres only. Kept separate from `snap` so it doesn't change what
   the Snap button means. */
let halfSnap = true;
let alignOn = true;
/* Icon boost is purely how the small kit is DRAWN. A ¼-yard cone is under a
   pixel wide when the whole field is on screen, which makes it impossible to
   place and read. Boost inflates the icon only — hw/hh, snapping, measurement
   and the box tool all keep working off the true footprint. */
let boost = false;
let tapeColor = "#facc15";
let tapeDashed = false;
let lineType = "tape";           // tape, pass, or shot (T1-7)
let rowRot = 0;                  // rotation for row mode equipment
let hidePathDuringPlay = false;  // hide ball path arrows during simulation
let guides = null;                // guide line being drawn (guides mode)
let pending = null;               // kit key armed by click
let uid = 1;
let measureLines = [];            // temporary measurement overlay lines

let history = [], hIdx = -1;

const $ = s => document.querySelector(s);
const viewport = $("#viewport"), inner = $("#inner"), statusEl = $("#status");

function setStatus(t){ statusEl.textContent = t; }
// empty grass is a pan handle, so the cursor has to say which one you'll get
function syncCursor(){ document.body.classList.toggle("armed", !!pending); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function pushHistory(){
  history = history.slice(0, hIdx+1);
  history.push(clone(state));
  if (history.length > 120){ history.shift(); }
  hIdx = history.length - 1;
  syncHistoryButtons();
}
function syncHistoryButtons(){
  $("#undoBtn").disabled = hIdx <= 0;
  $("#redoBtn").disabled = hIdx >= history.length - 1;
}
/* syncFields first: a step being undone may have been a rotation, and the kit has
   to be drawn onto a pitch facing the way it faced when that snapshot was taken. */
function undo(){ if (hIdx > 0){ simStop(); hIdx--; state = clone(history[hIdx]); syncFields(); renderAll(); renderSel(); syncHistoryButtons(); setStatus("Undone"); } }
function redo(){ if (hIdx < history.length-1){ simStop(); hIdx++; state = clone(history[hIdx]); syncFields(); renderAll(); renderSel(); syncHistoryButtons(); setStatus("Redone"); } }

/* ============================================================
   SIDEBAR
   ============================================================ */
(function buildSidebar(){
  const sb = $("#sidebar");
  sb.innerHTML = "";
  GROUP_ORDER.forEach(g => {
    const keys = Object.keys(KIT).filter(k => KIT[k].group === g);
    if (!keys.length) return;
    const h = document.createElement("div");
    h.className = "sb-title"; h.textContent = GROUP_TITLE[g] || g;
    sb.appendChild(h);
    const chips = CHIP_GROUPS.has(g);
    const box = document.createElement("div");
    box.className = chips ? "chips" : "tiles";
    keys.forEach(k => {
      const it = KIT[k];
      const b = document.createElement("button");
      b.className = "kit" + (chips ? " chip" : "");
      b.dataset.kit = k; b.draggable = true;
      b.title = it.name + (it.sub ? ` — ${it.sub}` : "");
      const icon = `<svg width="${chips ? 24 : 34}" height="${chips ? 24 : 20}" viewBox="${it.pv}"
                         preserveAspectRatio="xMidYMid meet">${it.draw()}</svg>`;
      b.innerHTML = chips
        ? icon + `<i class="cnt" data-cnt="${k}"></i>`
        : icon + `<span>${it.name}${it.sub ? `<small>${it.sub}</small>` : ""}</span>` +
                 `<i class="cnt" data-cnt="${k}"></i>`;
      box.appendChild(b);
    });
    sb.appendChild(box);
  });
})();

/* How many of each item are on the field you are looking at. The bag size is
   shown alongside where there is one, but it is information, not a gate —
   nothing stops you laying out a twelfth mini goal. */
function syncCounts(){
  const f = state[current];
  if (!f) return;
  const tally = {};
  f.items.forEach(i => { tally[i.type] = (tally[i.type] || 0) + 1; });
  document.querySelectorAll("[data-cnt]").forEach(el => {
    const k = el.dataset.cnt, n = tally[k] || 0, max = KIT[k] && KIT[k].max;
    el.textContent = n ? (max ? `${n}/${max}` : String(n)) : "";
    el.classList.toggle("over", !!max && n > max);
  });
}

$("#sidebar").addEventListener("click", e => {
  const b = e.target.closest(".kit"); if (!b) return;
  pending = (pending === b.dataset.kit) ? null : b.dataset.kit;
  document.querySelectorAll(".kit").forEach(x => x.classList.toggle("on", x.dataset.kit === pending));
  // arming equipment means you want to place it — tape and ball path don't place
  if (pending && (mode === "tape" || mode === "ball" || mode === "run" || mode === "box")) setMode("select");
  syncCursor();
  setStatus(!pending ? "Ready"
          : mode === "row" ? `Row mode — drag to lay a line of ${KIT[pending].name}`
          : `Click the field to place ${KIT[pending].name}`);
});
$("#sidebar").addEventListener("dragstart", e => {
  const b = e.target.closest(".kit"); if (!b) return;
  e.dataTransfer.setData("text/plain", b.dataset.kit);
  e.dataTransfer.effectAllowed = "copy";
  setStatus(`Dragging ${KIT[b.dataset.kit].name}`);
});

/* ============================================================
   FIELD CANVASES
   ============================================================ */
/* One tab per field, in FIELDS order, so adding a pitch above is the only edit.
   The size line under the name comes straight from the field's own yardage — two
   landscape pitches of similar shape are otherwise hard to tell apart at a glance,
   and this way a resize can never leave the tab claiming the old dimensions. */
document.getElementById("fieldTabs").innerHTML = Object.keys(FIELDS).map(k =>
  `<button class="tab${k === current ? " on" : ""}" data-field="${k}">` +
  `<span class="name">${FIELDS[k].label}</span>` +
  `<span class="dim">${FIELDS[k].lYd} × ${FIELDS[k].wYd} yd</span></button>`
).join("");

const wraps = {};
const svgs = {};

function createFieldWrapper(key){
  if (wraps[key]) return; // Already created
  const w = document.createElement("div");
  w.className = "field-wrap" + (key === current ? " on" : "");
  w.innerHTML = fieldMarkup(key);
  inner.appendChild(w);
  wraps[key] = w;
  svgs[key] = w.querySelector("svg");
}

for (const key in FIELDS){
  createFieldWrapper(key);
}

/* ------------------------------------------------------------
   ROTATION — a quarter turn clockwise, pitch and contents together
   ------------------------------------------------------------ */

// bring FIELDS[key] into line with the turn count the state is holding
function applyTurns(key){
  const f = FIELDS[key];
  const n = (((state[key] && state[key].turns) | 0) % 4 + 4) % 4;
  f.land = n % 2 ? !f.land0 : f.land0;
  let p = f.pad0;
  for (let i = 0; i < n; i++) p = rotPad(p);
  f.pad = p;
  deriveField(f);
}

/* Redraw a pitch's markings and reframe its viewBox, keeping the same <svg> node.
   Every pointer handler is bound to that node, so replacing it would quietly kill
   placing, dragging and panning on the rotated field. The layer <g>s come back
   empty; renderField and renderSel put their contents back. */
function rebuildFieldSVG(key){
  const svg = svgs[key], next = fieldMarkup(key);
  if (svg.__markup === next) return false;
  const tmp = document.createElement("div");
  tmp.innerHTML = next;
  const fresh = tmp.querySelector("svg");
  svg.setAttribute("viewBox", fresh.getAttribute("viewBox"));
  svg.innerHTML = fresh.innerHTML;
  svg.__markup = next;
  return true;
}
for (const key in FIELDS) svgs[key].__markup = fieldMarkup(key);

/* Undo, redo and Load all replace the whole state, and the state carries each
   pitch's orientation — so they have to reshape the pitches before drawing what
   sits on them. Cheap when nothing turned: rebuildFieldSVG is a no-op then. */
function syncFields(){
  let turned = false;
  for (const k in FIELDS){ applyTurns(k); turned = rebuildFieldSVG(k) || turned; }
  if (turned){ syncGuides(); syncGrid(); applyZoom(); }
  return turned;
}

/* Rotating a pitch rotates everything on it. Turning the field but leaving the
   cones where they were would scramble the drill, so kit, tape and ball-path
   stops all travel through the same quarter turn, and each item spins on its own
   axis too — a goal facing the touchline still faces the touchline afterwards. */
function rotateField(key){
  simStop();
  clearSel(true);
  const f = FIELDS[key];
  // the working area as it stands BEFORE the turn — the map is defined on it
  const H = f.vbH, ax0 = f.ax0, ay0 = f.ay0;

  state[key].turns = ((((state[key].turns | 0) + 1) % 4) + 4) % 4;
  applyTurns(key);

  /* A point sits at (u,v) from the top-left of the old area. A clockwise quarter
     turn sends it to (H-v, u) in the new area, which is H wide and W tall. Both
     areas start on a whole yard and H is a whole number of yards, so a point on
     the half-yard snap lattice lands back on it — rotating never knocks kit off
     the grid. */
  const rx = (x, y) => f.ax0 + (H - (y - ay0));
  const ry = (x, y) => f.ay0 + (x - ax0);
  const s = state[key];
  s.items.forEach(it => {
    const x = rx(it.x, it.y), y = ry(it.x, it.y);
    it.x = x; it.y = y;
    it.rot = (((it.rot || 0) + 90) % 360 + 360) % 360;
    /* A run's waypoints turn with the player. Leaving them behind would send a
       forward who was running onto the near post charging at a corner flag. */
    if (it.run && it.run.pts) it.run.pts.forEach(p => {
      const px = rx(p.x, p.y), py = ry(p.x, p.y);
      p.x = px; p.y = py;
    });
  });
  (s.tape || []).forEach(t => {
    const ax = rx(t.x1, t.y1), ay = ry(t.x1, t.y1);
    const bx = rx(t.x2, t.y2), by = ry(t.x2, t.y2);
    t.x1 = ax; t.y1 = ay; t.x2 = bx; t.y2 = by;
  });
  (s.seq || []).forEach(n => {
    if (n.k !== "p") return;                 // stops on a player follow the player
    const x = rx(n.x, n.y), y = ry(n.x, n.y);
    n.x = x; n.y = y;
  });

  rebuildFieldSVG(key);
  syncGuides();
  syncGrid();
  renderField(key);
  renderSel();
  applyZoom();
  pushHistory();
  const deg = state[key].turns * 90;
  setStatus(`${f.label} rotated 90° — ${deg ? deg + "° from its default" : "back to its default"}`);
}

function svgPoint(svg, clientX, clientY){
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
const HALF = U / 2;

/* Normally there are two valid lattices: the grid intersections (corners) and
   the centre of each 1-yard square. snapPoint picks between them by 2D distance,
   so a drop lands on a corner or dead centre of a cell — never on an edge
   midpoint, because a gate post halfway along a line is rarely what you meant.

   Half Grid opens that third set up. Each axis then rounds to the nearest half
   yard on its own, which is the union of all three: corners, cell centres and
   the middle of every grid line. */
function snapPoint(x, y){
  if (!snap) return { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };
  if (halfSnap) return { x: snapVal(x), y: snapVal(y) };
  const lat = (v, off) => ORIGIN + off + Math.round((v - ORIGIN - off) / U) * U;
  const cx = lat(x, 0),    cy = lat(y, 0);        // corners
  const mx = lat(x, HALF), my = lat(y, HALF);     // cell centres
  return Math.hypot(x - mx, y - my) < Math.hypot(x - cx, y - cy)
    ? { x:mx, y:my } : { x:cx, y:cy };
}
// single axis: nearest half-yard, i.e. the nearest corner OR centre line
function snapVal(v){ return snap ? ORIGIN + Math.round((v - ORIGIN) / HALF) * HALF : Math.round(v * 10) / 10; }

/* Keep the whole item inside the working area — the pitch plus its green
   surround, not the touchlines. Kit gets staged behind the goal and off the
   sideline in real sessions, which is the whole point of the surround. Uses the
   axis-aligned bounding box of the rotated footprint, so it works at any angle,
   not just multiples of 90. */
function clampItem(key, x, y, type, rot){
  const f = FIELDS[key], k = KIT[type];
  const t = (rot || 0) * Math.PI / 180;
  const c = Math.abs(Math.cos(t)), s = Math.abs(Math.sin(t));
  const hw = k.hw * c + k.hh * s;
  const hh = k.hw * s + k.hh * c;
  const x0 = f.ax0 + hw, x1 = f.ax1 - hw;
  const y0 = f.ay0 + hh, y1 = f.ay1 - hh;
  return { x: Math.min(x1, Math.max(x0, x)), y: Math.min(y1, Math.max(y0, y)) };
}

/* ---------- players never share space ----------
   A player fits inside its own cell, but two lattice points can still be closer
   than one diameter: a corner and the centre of an adjoining cell are 2.12 units
   apart. Rather than refuse the drop, walk outwards over the union lattice and
   take the nearest free point, so a formation fills in instead of stacking up. */
const MIN_GAP = PLAYER_R * 2;
function occupied(key, id, x, y){
  return state[key].items.some(i =>
    i.id !== id && KIT[i.type].player && Math.hypot(i.x - x, i.y - y) < MIN_GAP - 1e-6);
}
function freeSpot(key, id, type, rot, x, y){
  if (!snap || !KIT[type].player || !occupied(key, id, x, y)) return { x, y };
  // both indices even = same lattice, both odd = the other one. Mixed parity is
  // an edge midpoint, so it only joins the search once Half Grid is on.
  const cand = [];
  for (let i = -6; i <= 6; i++) for (let j = -6; j <= 6; j++){
    if (!halfSnap && ((i + j) & 1)) continue;
    if (!i && !j) continue;
    cand.push({ x: x + i * HALF, y: y + j * HALF, d: Math.hypot(i, j) });
  }
  cand.sort((a, b) => a.d - b.d);
  for (const c of cand){
    const p = clampItem(key, c.x, c.y, type, rot);
    if (Math.abs(p.x - c.x) > 1e-6 || Math.abs(p.y - c.y) > 1e-6) continue;   // outside the touchlines
    if (!occupied(key, id, p.x, p.y)) return p;
  }
  return { x, y };
}

// how much bigger this type is drawn than it really is, right now
function iconScale(type){
  const k = KIT[type];
  return (boost && k && k.bs) ? k.bs : 1;
}
function poseTransform(type, x, y, rot){
  const s = iconScale(type);
  return `translate(${x} ${y}) rotate(${rot})` + (s === 1 ? "" : ` scale(${s})`);
}
function itemTransform(it){ return poseTransform(it.type, it.x, it.y, it.rot || 0); }

function renderField(key){
  const f = state[key], svg = svgs[key];
  const tapeLayer = svg.querySelector(".tape-layer");
  const itemLayer = svg.querySelector(".item-layer");

  const tw = tapeWidth();
  tapeLayer.innerHTML = f.tape.map(t => {
    const dx = t.x2 - t.x1, dy = t.y2 - t.y1;
    const dist = Math.hypot(dx, dy) / U;
    const midx = (t.x1 + t.x2) / 2, midy = (t.y1 + t.y2) / 2;
    const angle = Math.atan2(dy, dx);
    const offset = 2.5;
    const labelx = midx + offset * Math.sin(angle);
    const labely = midy - offset * Math.cos(angle);
    return `<g data-tape="${t.id}">
       <line x1="${t.x1}" y1="${t.y1}" x2="${t.x2}" y2="${t.y2}" stroke="${t.color}" stroke-width="${tw}"
             stroke-linecap="round"${t.dashed ? ' stroke-dasharray="3 2"' : ""}/>
       <line class="tape-hit" x1="${t.x1}" y1="${t.y1}" x2="${t.x2}" y2="${t.y2}"/>
       ${showYardage ? `<text x="${labelx.toFixed(2)}" y="${labely.toFixed(2)}" text-anchor="middle" font-family="sans-serif" font-size="1.8" font-weight="600" fill="${t.color}" opacity="0.9">${fmtYd(dist)}</text>` : ""}
     </g>`;
  }).join("");

  itemLayer.innerHTML = f.items.map(it =>
    `<g class="item" data-id="${it.id}" data-type="${it.type}" transform="${itemTransform(it)}">${KIT[it.type].draw(it)}</g>`
  ).join("");

  renderUnits(key);
  renderGuides(key);
  renderRuns(key);
  renderPath(key);
  syncCounts();
  syncShapePanel();
  /* The run panel is driven off the drill, so it is refreshed wherever the drill
     is: adding a ball stop changes what a run can be triggered from, and undo can
     take a run away underneath the panel showing its settings. */
  syncRunPanel();
}
function renderAll(){ for (const k in state) renderField(k); syncCounts(); }

/* ============================================================
   BALL PATH  —  an ordered list of stops the ball travels through.
   A stop is either a player ({k:"i", id}) so the path follows that
   player when they are dragged, or a free point on the grass
   ({k:"p", x, y}).

   A player stop may also name a FOOT — {k:"i", id, foot:"L"|"R"} — and then the
   ball travels to that foot rather than to the middle of the player, so a drill
   can say "played out to the left foot" and the path shows it. `foot` absent or
   null means the centre, which is exactly what every stop did before feet existed,
   so drills saved earlier play back unchanged.
   ============================================================ */
const BALL_C = "#fbbf24";
const NODE_R = 2.0;               // shorten segment ends so arrows sit off the marker
const FOOT_GAP = 0.9;             // a foot stop is already outside the body — barely pull back
const STOP_OFF = 2.4;             // badge offset, clear of the smaller player disc

/* A stop on a player is wherever that player IS, which during playback means
   their live pose and not the mark they started on. A pass played back to
   someone who has since made a run has to follow them into the space — that is
   the whole point of a give-and-go, and a ball delivered to the spot they left
   is a pass into nobody.

   A foot stop already read the live pose, because footPos does; the centre did
   not, so the same drill behaved differently depending on whether the coach had
   named a foot. */
function nodePos(key, n){
  if (n.k === "p") return { x:n.x, y:n.y };
  const it = state[key].items.find(i => i.id === n.id);
  if (!it) return null;                          // player was deleted -> skip
  if (n.foot) return footPos(it, n.foot);
  const q = livePose(it);
  return { x:q.x, y:q.y };
}
/* Resolved stops, with the node kept alongside its point. The node is what says
   whether this stop is on a foot, which the path, the legs and the playback
   highlight all need — so resolving is done once, here, and everything downstream
   reads the same list. */
function seqResolved(key){
  const out = [];
  for (const n of (state[key].seq || [])){ const p = nodePos(key, n); if (p) out.push({ n, p }); }
  return out;
}
// resolved, deleted-node-free list of {x,y} for the current field
function seqPoints(key){ return seqResolved(key).map(r => r.p); }

/* A badge is numbered by what is VISIBLE, and seq can hold stops on players who
   have since been deleted, which render as nothing. So the badge index has to be
   walked back into seq rather than used as a subscript. Returns -1 for a badge
   that no longer resolves. */
function seqIndexAt(key, vis){
  const seq = state[key].seq || [];
  let seen = -1;
  for (let i = 0; i < seq.length; i++){
    if (!nodePos(key, seq[i])) continue;
    if (++seen === vis) return i;
  }
  return -1;
}
/* Take a stop out of the path. Right-clicking a badge is the only way in now
   that a plain click always adds — see the ball branch of pointerdown. */
function dropStop(key, vis){
  const idx = seqIndexAt(key, vis);
  if (idx < 0) return;
  state[key].seq.splice(idx, 1);
  renderField(key); pushHistory();
  setStatus(`Stop ${vis + 1} removed — ${seqPoints(key).length} left`);
}

/* Which foot the ball arrives on when a stop is added. Default to whichever foot
   is nearer the pass coming in — that is what actually happens on a pitch, and it
   means the common case needs no fiddling at all. Shift-clicking the stop badge
   overrides it afterwards. The first stop has no pass coming into it, so it stays
   on the centre, and a path with one stop behaves exactly as it always did. */
function pickFoot(key, it){
  const res = seqResolved(key);
  if (!res.length) return null;
  const prev = res[res.length - 1].p;
  const L = footPos(it, "L"), R = footPos(it, "R");
  return Math.hypot(prev.x - L.x, prev.y - L.y) <= Math.hypot(prev.x - R.x, prev.y - R.y) ? "L" : "R";
}

function renderGuides(key){
  const layer = svgs[key].querySelector(".ref-lines");
  if (!layer) return;
  const guides = state[key].guides || [];
  let out = layer.innerHTML;
  // Add user-drawn guides to the existing ref-lines layer
  guides.forEach(g => {
    out += `<line x1="${g.x1}" y1="${g.y1}" x2="${g.x2}" y2="${g.y2}"
                  stroke="rgba(255,255,255,0.72)" stroke-width="0.55" stroke-dasharray="2.5 2.5" fill="none"
                  data-guide="${g.id}" style="cursor:pointer"/>`;
  });
  layer.innerHTML = out;
}

function renderPath(key){
  const layer = svgs[key].querySelector(".path-layer");
  if (!layer) return;
  const res = seqResolved(key), pts = res.map(r => r.p);
  if (!pts.length){ layer.innerHTML = ""; return; }

  let out = "";
  for (let i = 1; i < pts.length; i++){
    const a = pts[i-1], b = pts[i];
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
    if (L < 0.01) continue;
    /* Pull both ends back so the line starts and stops clear of the markers. A stop
       on a foot is already outside the body, so it only needs the ball's own width
       of clearance — using the full marker radius there would leave the arrow
       hanging in space well short of the foot it is pointing at. */
    const ga = res[i-1].n.foot ? FOOT_GAP : NODE_R;
    const gb = res[i].n.foot   ? FOOT_GAP : NODE_R;
    const t0 = Math.min(ga / L, 0.45), t1 = 1 - Math.min(gb / L, 0.45);
    if (t1 <= t0) continue;
    out += `<line x1="${(a.x+dx*t0).toFixed(2)}" y1="${(a.y+dy*t0).toFixed(2)}"
                  x2="${(a.x+dx*t1).toFixed(2)}" y2="${(a.y+dy*t1).toFixed(2)}"
                  stroke="${BALL_C}" stroke-width="0.55" stroke-dasharray="2 1.6"
                  stroke-linecap="round" marker-end="url(#arw-${key})" opacity="0.95"/>`;
  }
  // numbered stop badges, offset up-left so they don't sit on the player number
  out += pts.map((p, i) =>
    `<g data-stop="${i}">
       <circle cx="${p.x - STOP_OFF}" cy="${p.y - STOP_OFF}" r="1.6" fill="${BALL_C}" stroke="rgba(0,0,0,0.5)" stroke-width="0.2"/>
       <text x="${p.x - STOP_OFF}" y="${p.y - STOP_OFF + 0.65}" text-anchor="middle" font-family="sans-serif"
             font-size="2.2" font-weight="700" fill="#3b2600">${i+1}</text>
       <circle class="stop-hit" cx="${p.x - STOP_OFF}" cy="${p.y - STOP_OFF}" r="2.6"/>
     </g>`).join("");

  layer.innerHTML = out;
}

/* ============================================================
   PLAYER MOVEMENT  —  runs
   A player may carry a `run`: waypoints they travel through during playback.

     it.run = { pts:[{x,y}...], trig:{ stop, delay }, speed }

   The run BEGINS wherever the player is standing rather than storing its own
   start point, so sliding a player before you press play slides the start of
   their run with them while the waypoints stay where the drill wants them.

   Timing is anchored to the ball, not to a clock. `trig` names the ball stop the
   run waits for and how long after the ball leaves it the player goes, which is
