function setMode(m){
  mode = m;
  $("#modeSelect").classList.toggle("on", m === "select");
  $("#modeRow").classList.toggle("on", m === "row");
  $("#modeTape").classList.toggle("on", m === "tape");
  $("#modeGuides").classList.toggle("on", m === "guides");
  $("#modeBall").classList.toggle("on", m === "ball");
  $("#modeRun").classList.toggle("on", m === "run");
  $("#modeBox").classList.toggle("on", m === "box");
  document.body.classList.toggle("drawing", m === "row" || m === "tape" || m === "guides");
  document.body.classList.toggle("ball-mode", m === "ball" || m === "run");
  document.body.classList.toggle("box-mode", m === "box");
  // T2: update body classes for mode-specific option visibility
  document.body.classList.remove("mode-select", "mode-row", "mode-tape", "mode-guides", "mode-ball", "mode-run", "mode-box");
  document.body.classList.add("mode-" + m);

  // T2-1: Show/hide mode options row and specific mode options
  const modeOptionsRow = $("#modeOptionsRow");
  const hasOptions = m === "row" || m === "tape" || m === "guides" || m === "ball" || m === "run";
  modeOptionsRow.style.display = hasOptions ? "flex" : "none";

  // Hide all mode option groups
  document.querySelectorAll("#rowOpts, #tapeOpts, #simOpts, #runOpts").forEach(el => el.style.display = "none");

  // Show relevant mode options
  if (m === "row") $("#rowOpts").style.display = "flex";
  if (m === "tape") $("#tapeOpts").style.display = "flex";
  if (m === "guides") setStatus("Guides — drag to draw permanent guide lines");
  if (m === "ball") $("#simOpts").style.display = "flex";
  if (m === "run") { $("#simOpts").style.display = "flex"; $("#runOpts").style.display = "flex"; }
  $("#tapeOpts").style.opacity = m === "tape" ? "1" : "0.45";
  $("#rowOpts").style.opacity  = m === "row"  ? "1" : "0.75";
  $("#simOpts").style.opacity  = (m === "ball" || m === "run") ? "1" : "0.75";
  $("#boxOpts").style.opacity  = m === "box"  ? "1" : "0.45";
  if (m === "tape" || m === "guides" || m === "ball" || m === "run" || m === "box"){
    pending = null;
    document.querySelectorAll(".kit").forEach(x => x.classList.remove("on"));
  }
  /* Changing tool ends the drill, whichever tool you are changing to. This used
     to matter only in Ball Path mode, because a playing ball lived in its own
     layer and editing around it was harmless. Players do not: playback poses them
     by writing transforms onto their markers, so a sim left running while you
     switch to Select would leave everybody standing wherever the run had got to,
     with the state saying they were still on their marks. */
  simStop();
  // leaving Run mode puts the pen down; the run itself stays on the player
  if (m !== "run") setRunner(null, true);
  if (m !== "box") clearSel(true);           // the overlay is only live in Box mode
  /* Unconditional rather than "only when leaving run mode": today setRunner(null)
     above guarantees nobody is armed on the way in, so the panel would hide
     anyway, but that is an invariant of the line above rather than of this one,
     and a future entry path that arms someone would leave a stale panel. */
  syncRunPanel();
  syncCursor();
  setStatus(m === "box" ? "Box mode — drag across the grid to measure an area"
          : m === "tape" ? "Tape mode — drag to draw a line"
          : m === "run"  ? "Run mode — click a player then click their waypoints, or drag from them to draw the run"
          : m === "ball" ? (seqPoints(current).length
                              ? `Ball path — ${seqPoints(current).length} stops. Click to add, including a player already in the path. Right-click a stop to remove it.`
                              : "Ball path — click a player to start the ball there, then click each next stop. Click someone twice to play it back to them.")
          : m === "row"  ? (pending ? `Row mode — drag to lay a line of ${KIT[pending].name}`
                                    : "Row mode — pick equipment from the left, then drag")
          : "Select mode");
}

document.addEventListener("keydown", e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (typing) return;
  const meta = e.metaKey || e.ctrlKey;
  if (meta && e.key.toLowerCase() === "z"){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  // Escape drops a selection first; a second press leaves Box mode entirely
  if (e.key === "Escape" && boxSel){ clearSel(); return; }
  // likewise: Escape finishes the run you are drawing before it leaves Run mode
  if (e.key === "Escape" && runner){ setRunner(null); return; }
  if (e.key === "Escape"){ pending = null; document.querySelectorAll(".kit").forEach(x=>x.classList.remove("on")); setMode("select"); }
  if (e.key === "v" || e.key === "V") setMode("select");
  if (e.key === "r" || e.key === "R") setMode("row");
  if (e.key === "t" || e.key === "T") setMode("tape");
  if (e.key === "b" || e.key === "B") setMode("ball");
  if (e.key === "u" || e.key === "U") setMode("run");
  if (e.key === "x" || e.key === "X") setMode("box");
  if (e.key === " "){ e.preventDefault(); togglePlay(); }
  if (e.key === "0"){ $("#zoomFit").click(); }
  // arrow keys nudge the view while zoomed in
  const nudge = { ArrowLeft:[-60,0], ArrowRight:[60,0], ArrowUp:[0,-60], ArrowDown:[0,60] }[e.key];
  if (nudge){ e.preventDefault(); viewport.scrollLeft += nudge[0]; viewport.scrollTop += nudge[1]; }
});

/* ============================================================
   SAVED SETUPS  (localStorage, with in-memory fallback)
   ============================================================ */
const KEY = "sfp.setups.v2";
let memStore = null;

function readSetups(){
  if (memStore) return memStore;
  try { return JSON.parse(localStorage.getItem(KEY) || "{}"); }
  catch(err){ memStore = memStore || {}; return memStore; }
}
function writeSetups(obj){
  try { localStorage.setItem(KEY, JSON.stringify(obj)); }
  catch(err){ memStore = obj; setStatus("Saved for this session only (storage unavailable)"); }
}
function refreshSetupList(){
  const all = readSetups(), sel = $("#setupList"), keep = sel.value;
  sel.innerHTML = '<option value="">— saved —</option>' +
    Object.keys(all).sort().map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  sel.value = all[keep] ? keep : "";
}
$("#saveSetup").onclick = () => {
  const name = $("#setupName").value.trim();
  if (!name){ setStatus("Give the setup a name first"); return; }
  const all = readSetups();
  all[name] = clone(state);
  writeSetups(all); refreshSetupList();
  $("#setupList").value = name;
  /* The plan is drawn against what is saved, so saving under a name a block was
     waiting for turns that block from missing back into a drill. */
  renderSession();
  setStatus(`Saved “${name}”`);
};
/* Putting a saved setup on the pitch, migrations and all.
   Split out of the Load button because a session block loads a drill by exactly
   the same route. Two copies of this would drift, and the copy that drifted
   would be the one that quietly stopped clamping items back inside a re-cut
   pitch — a bug you would only ever see in the half of the app you edited last. */
function applySetup(name){
  const all = readSetups();
  if (!name || !all[name]) return false;
  simStop();
  clearSel(true);
  state = clone(all[name]);
  /* Reshape the pitches before touching what sits on them. A setup saved with a
     field rotated has to come back onto a field rotated the same way, and the
     clamping below measures against the field's bounds — which move when it
     turns. Setups saved before rotation existed have no turn count and default
     to the pitch's declared orientation. */
  for (const k in FIELDS){
    state[k] = state[k] || {items:[],tape:[],seq:[],units:[],guides:[],turns:0};
    state[k].turns = ((((state[k].turns | 0) % 4) + 4) % 4);
  }
  syncFields();
  for (const k in FIELDS){
    // migrate pre-overhaul kit names, then drop anything still unrecognised
    state[k].items = (state[k].items || [])
      .map(i => (i && TYPE_ALIAS[i.type]) ? { ...i, type:TYPE_ALIAS[i.type] } : i)
      .filter(i => i && KIT[i.type])
      // The pitch was re-cut to whole yards, so a setup saved on the older,
      // slightly wider field can carry items a fraction past the touchline.
      // Re-clamp on load rather than letting them hang off the edge.
      .map(i => ({ ...i, ...clampItem(k, i.x, i.y, i.type, i.rot) }));
    const inX = v => Math.min(FIELDS[k].ax1, Math.max(FIELDS[k].ax0, v));
    const inY = v => Math.min(FIELDS[k].ay1, Math.max(FIELDS[k].ay0, v));
    state[k].tape = (state[k].tape || [])
      .map(t => ({ ...t, x1:inX(t.x1), y1:inY(t.y1), x2:inX(t.x2), y2:inY(t.y2) }));
    // drop stops that point at equipment the setup no longer contains
    const ids = new Set(state[k].items.map(i => i.id));
    state[k].seq = (state[k].seq || []).filter(n =>
      n && (n.k === "p" ? Number.isFinite(n.x) && Number.isFinite(n.y) : ids.has(n.id)));
    /* Normalise the foot. Setups saved before feet existed have none, and anything
       that is not exactly "L" or "R" means the centre — so a corrupted or hand-edited
       value degrades to the old behaviour rather than sending the ball somewhere
       nonsensical. */
    state[k].seq.forEach(n => { if (n.foot !== "L" && n.foot !== "R") delete n.foot; });
    /* Units hold player ids, so a setup that lost players — an older save, a
       hand-edited file — must lose them from its units too. A unit emptied that
       way is dropped rather than kept as a named nothing, but one that merely
       shrank stays: three of the back four is still a back four, and re-forming
       it by hand would be worse than defending with three. */
    state[k].units = (state[k].units || [])
      .filter(u => u && Array.isArray(u.ids))
      .map(u => ({ ...u, ids: u.ids.filter(id => ids.has(id)),
                   policy: SHAPE[u.policy] ? u.policy : SHAPE_DEFAULT,
                   amount: Math.max(0, Math.min(1, +u.amount || 0)),
                   lag: Math.max(0, +u.lag || 0) }))
      .filter(u => u.ids.length);
  }
  uid = Date.now() % 1000000;   // avoid id collisions with loaded objects
  renderAll(); pushHistory();
  $("#setupName").value = name;
  return true;
}
$("#loadSetup").onclick = () => {
  const name = $("#setupList").value;
  if (applySetup(name)) setStatus(`Loaded “${name}”`);
};
$("#delSetup").onclick = () => {
  const name = $("#setupList").value;
  if (!name) return;
  const all = readSetups();
  delete all[name];
  writeSetups(all); refreshSetupList();
  renderSession();          // any block that used it now reads as missing
  setStatus(`Deleted “${name}”`);
};

/* ============================================================
   SESSION PLAN

   A session is a running order: an ordered list of blocks, each naming a saved
   setup, with minutes and coaching points.

   The load-bearing decision is that a block stores the setup's NAME and not a
   copy of its contents. Fix a drill once and every session that uses it is
   fixed; the alternative gives you eight private copies of the rondo and no way
   to tell which one is current. The cost is a block that points at a setup you
   later deleted, and the answer to that is to show it as missing rather than to
   drop it — a plan that quietly loses a drill is worse than one that tells you
   which drill it has lost, and the block can be pointed somewhere else.

   Session edits deliberately do NOT go through pushHistory. Undo belongs to the
   drawing on the pitch; a coach who nudges a cone, then reorders the evening,
   then presses undo means the cone. Clear does not touch the plan either, for
   the same reason: it clears a pitch, not a schedule.
   ============================================================ */
/* Names are typed by a coach and then interpolated into markup. A drill called
   Overload 3 v 2 <wide> is a reasonable thing to type and should come back out
   as the same string, not as a broken tag. */
function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

const SKEY = "sfp.sessions.v1";
let sesMem = null;
let session = { blocks: [] };
let sesAt = -1;                       // which block is on the pitch, -1 for none

function readSessions(){
  if (sesMem) return sesMem;
  try { return JSON.parse(localStorage.getItem(SKEY) || "{}"); }
  catch(err){ sesMem = sesMem || {}; return sesMem; }
}
function writeSessions(obj){
  try { localStorage.setItem(SKEY, JSON.stringify(obj)); }
  catch(err){ sesMem = obj; setStatus("Session saved for this session only (storage unavailable)"); }
}
function refreshSessionList(){
  const all = readSessions(), sel = $("#sesList"), keep = sel.value;
  sel.innerHTML = '<option value="">— saved —</option>' +
    Object.keys(all).sort().map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  sel.value = all[keep] ? keep : "";
}

const sesMins = b => Math.max(0, Math.min(240, Math.round(+b.mins || 0)));
const sesTotal = () => session.blocks.reduce((a, b) => a + sesMins(b), 0);
/* Minutes as a coach says them: 75 is "1h 15", not "75 min". */
function clockStr(m){
  m = Math.round(m);
  return m >= 60 ? `${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}` : `${m} min`;
}

function renderSession(){
  const wrap = $("#sesBlocks"), have = readSetups();
  let run = 0;
  wrap.innerHTML = session.blocks.map((b, i) => {
    const start = run; run += sesMins(b);
    const gone = !have[b.setup];
    return `<div class="sblock${i === sesAt ? " on" : ""}${gone ? " gone" : ""}" data-i="${i}">
      <div class="row">
        <span class="ord">${i + 1}</span>
        <button class="who" data-go="${i}" title="${gone
          ? "This setup no longer exists — save one under this name, or remove the block"
          : "Put this drill on the pitch"}">${esc(b.setup)}${gone ? " (missing)" : ""}</button>
      </div>
      <div class="row">
        <input type="number" class="mins" data-mins="${i}" value="${sesMins(b)}"
               min="0" max="240" step="1" title="Minutes">
        <span class="unit">min</span>
        <button class="mini icon-btn" data-mv="${i}" data-d="-1" title="Move earlier"${i === 0 ? " disabled" : ""}>◀</button>
        <button class="mini icon-btn" data-mv="${i}" data-d="1" title="Move later"${i === session.blocks.length - 1 ? " disabled" : ""}>▶</button>
        <button class="mini icon-btn" data-rm="${i}" title="Remove from the session">✕</button>
      </div>
      <textarea data-notes="${i}" placeholder="Coaching points">${esc(b.notes || "")}</textarea>
      <div class="clock">starts ${clockStr(start)} in</div>
    </div>`;
  }).join("");

  const n = session.blocks.length;
  $("#sesTotal").textContent = n
    ? `${n} drill${n === 1 ? "" : "s"} · ${clockStr(sesTotal())}`
    : "empty";
  $("#sesPrev").disabled = sesAt <= 0;
  $("#sesNext").disabled = sesAt >= n - 1;
  $("#sesPrint").disabled = !n;
}

/* Put block i on the pitch. The block stays current even when its setup has
   gone missing — you asked for that drill, and moving the highlight somewhere
   else would just hide the problem. */
function goBlock(i){
  const b = session.blocks[i];
  if (!b) return;
  sesAt = i;
  if (applySetup(b.setup)) setStatus(`Drill ${i + 1} of ${session.blocks.length} — “${b.setup}”`);
  else setStatus(`“${b.setup}” is not saved any more`);
  renderSession();
}

$("#sesAdd").onclick = () => {
  /* The drill being added is the one named in the Setups box, which is also
     what Save writes to and what Load fills in — so "save it, add it" works
     without naming the same thing twice. */
  const name = $("#setupName").value.trim() || $("#setupList").value;
  if (!name){ setStatus("Name the setup first, then add it"); return; }
  if (!readSetups()[name]){ setStatus(`Save “${name}” before adding it to a session`); return; }
  session.blocks.push({ setup:name, mins:15, notes:"" });
  sesAt = session.blocks.length - 1;
  renderSession();
  setStatus(`Added “${name}” — ${clockStr(sesTotal())} in the plan`);
};
$("#sesBlocks").addEventListener("click", e => {
  const go = e.target.closest("[data-go]"), mv = e.target.closest("[data-mv]"),
        rm = e.target.closest("[data-rm]");
  if (go) return goBlock(+go.dataset.go);
  if (mv){
    const i = +mv.dataset.mv, j = i + (+mv.dataset.d);
    if (j < 0 || j >= session.blocks.length) return;
    const [b] = session.blocks.splice(i, 1);
    session.blocks.splice(j, 0, b);
    // the highlight follows the drill, not the slot it used to sit in
    if (sesAt === i) sesAt = j; else if (sesAt === j) sesAt = i;
    renderSession();
    return;
  }
  if (rm){
    const i = +rm.dataset.rm, name = session.blocks[i].setup;
    session.blocks.splice(i, 1);
    if (sesAt === i) sesAt = -1; else if (sesAt > i) sesAt--;
    renderSession();
    setStatus(`Removed “${name}” from the session — the setup itself is untouched`);
  }
});
$("#sesBlocks").addEventListener("input", e => {
  const m = e.target.closest("[data-mins]"), n = e.target.closest("[data-notes]");
  if (m){
    session.blocks[+m.dataset.mins].mins = sesMins({ mins:m.value });
    /* Only the totals are redrawn: re-rendering the strip on every keystroke
       would take the caret out of the box being typed in. */
    let run = 0;
    [...$("#sesBlocks").children].forEach((el, i) => {
      el.querySelector(".clock").textContent = `starts ${clockStr(run)} in`;
      run += sesMins(session.blocks[i]);
    });
    const c = session.blocks.length;
    $("#sesTotal").textContent = `${c} drill${c === 1 ? "" : "s"} · ${clockStr(sesTotal())}`;
  }
  if (n) session.blocks[+n.dataset.notes].notes = n.value;
});
$("#sesPrev").onclick = () => goBlock(sesAt - 1);
$("#sesNext").onclick = () => goBlock(sesAt < 0 ? 0 : sesAt + 1);

$("#sesSave").onclick = () => {
  const name = $("#sesName").value.trim();
  if (!name){ setStatus("Give the session a name first"); return; }
  if (!session.blocks.length){ setStatus("An empty session is not worth saving"); return; }
  const all = readSessions();
  all[name] = clone(session);
  writeSessions(all); refreshSessionList();
  $("#sesList").value = name;
  setStatus(`Saved session “${name}”`);
};
$("#sesLoad").onclick = () => {
  const name = $("#sesList").value, all = readSessions();
  if (!name || !all[name]) return;
  /* Normalise on the way in. A session file can outlive an app version, be
     hand-edited, or be shared — so a block is only a block if it names a setup,
     and everything else about it degrades to a sane default rather than
     throwing halfway through drawing the strip. */
  session = { blocks: (all[name].blocks || [])
    .filter(b => b && typeof b.setup === "string" && b.setup)
    .map(b => ({ setup:b.setup, mins:sesMins(b), notes:String(b.notes || "") })) };
  sesAt = -1;
  $("#sesName").value = name;
  renderSession();
  const missing = session.blocks.filter(b => !readSetups()[b.setup]).length;
  setStatus(missing
    ? `Loaded “${name}” — ${missing} drill${missing === 1 ? " is" : "s are"} missing its setup`
    : `Loaded session “${name}”`);
};
$("#sesDel").onclick = () => {
  const name = $("#sesList").value;
  if (!name) return;
  const all = readSessions();
  delete all[name];
  writeSessions(all); refreshSessionList();
  setStatus(`Deleted session “${name}”`);
};

/* ============================================================
   EXPORT
   ============================================================ */
$("#exportPng").onclick = () => {
  const f = FIELDS[current];
  const svg = svgs[current].cloneNode(true);
  svg.removeAttribute("style");
  svg.querySelector(".sel-layer").innerHTML = "";   // the measuring box is not part of the plan
  svg.setAttribute("width", f.vbW * 6);
  svg.setAttribute("height", f.vbH * 6);
  const xml = new XMLSerializer().serializeToString(svg);
  const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = f.vbW * 6; c.height = f.vbH * 6;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#0f1310"; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(b => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      // named off the tab label, so a new field in FIELDS names its own export
      a.download = f.label.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-setup.png";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      setStatus("PNG exported");
    }, "image/png");
  };
  img.onerror = () => setStatus("Export failed — try Print instead");
  img.src = url;
};
$("#printBtn").onclick = () => window.print();

/* The picture for one block: the pitch with the most on it.
   A setup usually only uses one field, but nothing stops it using two, and the
   busiest is the one the drill is actually on — picking `current` instead would
   print whichever tab happened to be showing when you pressed the button. */
function busiestField(){
  let best = current, n = -1;
  for (const k in FIELDS){
    const s = state[k] || {};
    const c = (s.items || []).length + (s.tape || []).length + (s.seq || []).length;
    if (c > n){ n = c; best = k; }
  }
  return best;
}
/* Where the drill actually is, in pitch units — every cone, every ball stop,
   every waypoint of every run. A rondo in one corner of a full pitch has no
   business printing as a full pitch: at plan size a player is about a
   millimetre across, and the coach gets three identical green rectangles. */
function drillBox(k){
  const s = state[k] || {};
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const put = (x, y) => {
    if (!Number.isFinite(x) || !Number.isFinite(y)) return;
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  };
  (s.items || []).forEach(i => {
    put(i.x, i.y);
    if (i.run && i.run.pts) i.run.pts.forEach(p => put(p.x, p.y));
  });
  (s.tape || []).forEach(t => { put(t.x1, t.y1); put(t.x2, t.y2); });
  // stops pinned to a piece of kit are already covered by that kit's position
  (s.seq || []).forEach(n => { if (n.k === "p") put(n.x, n.y); });
  return x0 === Infinity ? null : { x0, y0, x1, y1 };
}

/* The window to print: the drill, with room to breathe, never smaller than a
   quarter-pitch and never larger than the working area. The aspect ratio is
   forced to match the pitch's own, because the card reserves a fixed box and
   letting the viewBox go a different shape would letterbox one drill and not
   the next — three cards that no longer line up down the page. */
function printBox(k){
  const f = FIELDS[k], b = drillBox(k);
  const full = { x: f.ax0, y: f.ay0, w: f.vbW, h: f.vbH };
  if (!b) return full;                                  // nothing on it: print the pitch
  const aspect = f.vbW / f.vbH;
  /* The floor is a legibility floor, not a fraction of the pitch: a cone is a
     quarter of a yard across, so much under about 26 yards to the card's width
     and it stops being a cone and starts being a speck. */
  const PADU = 5 * U, MINW = 26 * U;
  let w = Math.max(b.x1 - b.x0 + PADU * 2, MINW);
  let h = Math.max(b.y1 - b.y0 + PADU * 2, MINW / (f.vbW / f.vbH));
  if (w / h > aspect) h = w / aspect; else w = h * aspect;
  if (w >= f.vbW || h >= f.vbH) return full;
  // centre on the drill, then slide back inside the pitch rather than shrinking
  let x = (b.x0 + b.x1) / 2 - w / 2, y = (b.y0 + b.y1) / 2 - h / 2;
  x = Math.min(f.ax1 - w, Math.max(f.ax0, x));
  y = Math.min(f.ay1 - h, Math.max(f.ay0, y));
  return { x, y, w, h };
}

function pitchPicture(){
  const k = busiestField(), f = FIELDS[k];
  const svg = svgs[k].cloneNode(true);
  svg.removeAttribute("style");
  svg.removeAttribute("width"); svg.removeAttribute("height");
  // the measuring box and the drag ghost are tools, not part of the plan
  svg.querySelector(".sel-layer").innerHTML = "";
  const gh = svg.querySelector(".ghost-layer"); if (gh) gh.innerHTML = "";
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  const v = printBox(k);
  svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`);
  /* Only say "detail" when it is one — a window trimmed by a few yards to make
     the aspect ratio come out is still, to a coach reading the sheet, the pitch. */
  const zoomed = v.w < f.vbW * 0.85;
  return { html: svg.outerHTML, label: f.label + (zoomed ? " · detail" : "") };
}

$("#sesPrint").onclick = () => {
  if (!session.blocks.length) return;
  simStop();
  /* Every block has to be put on the pitch to be photographed, which means the
     coach's live work is about to be overwritten eleven times. Snapshot it and
     put it back — including which tab was showing and where the plan was up to,
     because a print that silently moved you to drill 7 would be its own bug. */
  const keep = { state:clone(state), tab:current, at:sesAt, name:$("#setupName").value };
  const have = readSetups();
  let run = 0;
  const cards = session.blocks.map((b, i) => {
    const start = run, mins = sesMins(b); run += mins;
    const pic = have[b.setup] && applySetup(b.setup) ? pitchPicture() : null;
    return `<div class="card">
      <div class="pic">${pic ? pic.html : '<div class="none">setup not found</div>'}</div>
      <div>
        <h2>${i + 1}. ${esc(b.setup)}</h2>
        <div class="meta">${mins} min · starts ${clockStr(start)} in${pic ? ` · ${esc(pic.label)}` : ""}</div>
        ${b.notes ? `<p>${esc(b.notes)}</p>` : '<p class="none">No coaching points</p>'}
      </div>
    </div>`;
  }).join("");

  state = keep.state;
  syncFields();
  // back to the tab that was showing, through the tab's own handler
  const tab = document.querySelector(`.tab[data-field="${keep.tab}"]`);
  if (tab && keep.tab !== current) tab.click();
  renderAll(); pushHistory();
  sesAt = keep.at; $("#setupName").value = keep.name;
  renderSession();

  const title = $("#sesName").value.trim() || "Training session";
  $("#planSheet").innerHTML =
    `<h1>${esc(title)}</h1>
     <div class="sub">${session.blocks.length} drill${session.blocks.length === 1 ? "" : "s"} · ${clockStr(sesTotal())} total</div>
     ${cards}`;
  document.body.classList.add("printing-plan");
  /* Tear the sheet down on the way back from the print dialog rather than
     leaving a second copy of the app in the DOM for the rest of the session. */
  const done = () => {
    document.body.classList.remove("printing-plan");
    $("#planSheet").innerHTML = "";
    window.removeEventListener("afterprint", done);
  };
  window.addEventListener("afterprint", done);
  window.print();
  // afterprint is not fired everywhere; this is the belt to that braces
  setTimeout(done, 1200);
  setStatus(`Printed ${session.blocks.length} drills — ${clockStr(sesTotal())}`);
};

/* ============================================================
   BOOT
   ============================================================ */
console.log("Boot starting...");
console.log("Current field:", current);
console.log("State keys:", Object.keys(state));
console.log("Wraps keys before render:", Object.keys(wraps));

renderAll();
console.log("After renderAll, wraps keys:", Object.keys(wraps));

pushHistory();
applyZoom();
setMode("select");
refreshSetupList();
refreshSessionList();
renderSession();
$("#tapeOpts").style.opacity = "0.45";

setTimeout(() => $("#zoomFit").click(), 100);
setStatus("Ready — drag equipment onto the field");
console.log("Boot complete");

})();
</script>
</body>
</html>
